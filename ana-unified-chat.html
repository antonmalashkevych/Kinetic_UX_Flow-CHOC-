  g.font='10px "JetBrains Mono",monospace';g.fillStyle=run?'rgba(200,185,255,.95)':'rgba(141,148,173,.9)';g.fillText(sub,x,y+r+29);
}

/* ---- loop ---- */
let agPrev=performance.now(),fleetNext=performance.now()+6000,agFeedKey='';
function fleetTick(now){
  if(now<fleetNext)return;fleetNext=now+8000+Math.random()*7000;
  if(Object.keys(LIVE).length>=2)return;
  const cand=AGENTS.filter(a=>a.status==='active'&&!LIVE[a.id]);if(!cand.length)return;
  startLive(cand[Math.floor(Math.random()*cand.length)]);
}
function agLoop(now){
  const dt=Math.min(64,now-agPrev);agPrev=now;
  for(const id in LIVE){const r=LIVE[id];r.clock+=dt;if(r.clock>=r.total)finishRun(r)}
  if(PLAY&&!PLAY.live&&PLAY.playing){PLAY.clock+=dt*PLAY.speed;if(PLAY.clock>=PLAY.total){PLAY.clock=PLAY.total;PLAY.playing=false;agPlayUI()}}
  FX=FX.filter(f=>now<f.t0+f.dur+400);
  fleetTick(now);
  if(S.page==='agents'){
    const f=el('agfleet');if(f&&fitCanvas(f)){if(!S.ag.hoverId&&!RMOTION)fleetRot+=dt*6.283/420000;drawFleet(f,now)}
    const m=el('agmap');if(m&&PLAY&&fitCanvas(m))drawAgentMap(m,PLAY,now);
    agDomTick();
  }
  requestAnimationFrame(agLoop);
}

/* ---- live DOM (feed, now line, scrubber) without re-rendering the page ---- */
function feedRows(run){
  const c=run.clock,rows=[];
  for(const e of run.ev){if(c<e.t)continue;const state=e.err&&c>=e.t+e.dur?'err':(e.dur&&c<e.t+e.dur?'run':'done');
    const p=rows[rows.length-1];
    if(p&&state==='done'&&p.state==='done'&&p.e.st===e.st&&!e.msg&&!e.ans&&!p.e.msg&&!p.e.ans&&!e.ask&&!p.e.ask){p.n++;p.dur+=e.dur;continue}
    rows.push({e,state,n:0,dur:e.dur})}
  const running=rows.filter(r=>r.state==='run'),rest=rows.filter(r=>r.state!=='run').reverse();
  return running.concat(rest).slice(0,16);
}
function rowHTML(r,run){
  const e=r.e,c=run.clock,st=STN[e.st];const col=`rgb(${e.st==='you'?AGX.you:AGX[st.h]})`;
  const g=r.state==='run'?`<span style="color:${col}">●</span>`:r.state==='err'?'✕':e.ans?'<span style="color:var(--cb-accent)">◆</span>':'·';
  const tm=r.state==='run'?fmtMs(c-e.t):e.ans?fmtMs(e.t):e.msg||e.stop?'-':fmtMs(r.dur);
  return `<div class="ag-row ${r.state}${e.ans?' ans':''}"><span class="g">${g}</span><span class="st" style="${r.state==='run'?'color:'+col:''}">${st.l}</span><span class="lb" title="${esc(e.l)}">${esc(e.l)}</span><span class="tm">${r.n?`<span class="more">+${r.n}</span> `:''}${tm}</span></div>`;
}
function nowHTML(run){
  const c=run.clock,a=run.ev.filter(e=>e.dur&&c>=e.t&&c<e.t+e.dur),pct=Math.round(tokAt(run,c)/run.cfg.cap*100);
  if(runDone(run)){const tk=fmtK(tokAt(run,run.total));
    if(run.kind==='budget')return `<span style="color:#ff9a9a">Stopped · token budget reached</span><small>${fmtMs(run.end)} · ${tk} of ${run.cfg.cap}K cap · resumable from checkpoint</small>`;
    if(run.kind==='failed')return `<span style="color:#ff9a9a">Finished with a data gap</span><small>${fmtMs(run.end)} · ${tk} tokens · partial context delivered</small>`;
    return `<span style="color:#ffd0ad">Finished · delivered</span><small>${fmtMs(run.end)} · ${tk} tokens · ${pct}% of the ${run.cfg.cap}K cap</small>`}
  if(!a.length){const last=[...run.ev].reverse().find(e=>c>=e.t);return last?`${STN[last.st].l}: ${esc(last.l)}<small>tokens ${pct}%</small>`:'Starting<small>tokens 0%</small>'}
  return `${STN[a[0].st].l}: ${esc(a[0].l)}${a.length>1?` <span style="color:#8d94ad">and ${a.length-1} more</span>`:''}<small>tokens ${pct}% of ${run.cfg.cap}K</small>`;
}
function agDomTick(){
  const fs=el('agfleetsum');if(fs){const t=fleetSummary();if(fs.textContent!==t)fs.textContent=t}
  if(!PLAY||!el('agfeed'))return;
  const r=PLAY,c=r.clock;
  const key=r.num+'|'+Math.floor(c/100)+'|'+r.live;
  if(key===agFeedKey)return;agFeedKey=key;
  const rows=feedRows(r);
  el('agfeed').innerHTML=`<div class="ag-feedh"><span>Run feed</span><span>${r.ev.filter(e=>c>=e.t).length} of ${r.ev.length} steps</span></div>`+(rows.length?rows.map(x=>rowHTML(x,r)).join(''):'<div class="ag-empty">Waiting for the first call</div>');
  const nw=el('agnow');if(nw)nw.innerHTML=nowHTML(r);
  const pr=el('agprog');if(pr)pr.style.width=(Math.min(1,c/r.end)*100).toFixed(2)+'%';
  const tm=el('agtime');if(tm)tm.textContent=fmtMs(Math.min(c,r.end));
  const rs=el('agresult');if(rs){const d=runDone(r)?'1':'0';if(rs.dataset.d!==d+r.num){rs.dataset.d=d+r.num;rs.innerHTML=resultHTML(r)}}
  const tg=el('agtag');if(tg){const t=tagHTML();if(tg.dataset.k!==t){tg.dataset.k=t;tg.innerHTML=t}}
}
function agPlayUI(){const p=el('agplaybar');if(p)p.innerHTML=playBarHTML()}
function fleetSummary(){const n=Object.keys(LIVE).length,p=APPROVALS.filter(x=>!x.decided).length;return `${AGENTS.length} agents · ${n} running · ${p} approval${p===1?'':'s'} waiting`}

/* ---- views ---- */
function legendHTML(){return `<div class="ag-legend">${[['Data','grounding'],['Governance','governance'],['Reasoning','agent'],['Outputs','exec'],['You','you']].map(([l,h])=>`<span><i style="color:rgb(${AGX[h]});background:rgb(${AGX[h]})"></i>${l}</span>`).join('')}</div>`}
function heroHTML(){
  if(!S.ag.hero)return `<button class="ag-herocollapsed" data-ag="hero">${ic('network')}Show the fleet map<span>${esc(fleetSummary())}</span></button>`;
  return `<div class="ag-stage ag-hero"><canvas id="agfleet" role="img" aria-label="Live map of all agents and the data they use"></canvas>
    <div class="ag-ov tl"><p class="ag-ovt">Fleet · live</p><p class="ag-ovs" id="agfleetsum">${esc(fleetSummary())}</p></div>
    <button class="ag-ov tr k-btn k-btn--quiet ag-hide" data-ag="hero">${ic('minimize-2')}Hide map</button>
    <div class="ag-ov bl">${legendHTML()}</div><div class="ag-ov br ag-hint">Click an agent to open its map</div>
    <div id="agtip" class="ag-tip" hidden></div></div>`;
}
function stripHTML(a){return `<span class="ag-strip" aria-label="Last runs">${a.runs.slice(0,8).reverse().map(r=>`<i class="${r.kind}" title="Run #${r.num} · ${KIND[r.kind][1]} · ${esc(r.when)}"></i>`).join('')}</span>`}
function agentsHTML(){return S.ag.view==='detail'&&agById(S.ag.id)?agDetailHTML():agListHTML()}
function agListHTML(){
  const pend=APPROVALS.filter(x=>!x.decided).length,t=S.ag.tab;
  const body=t==='Approvals'?apHTML():t==='Activity'?actHTML():myAgentsHTML();
  return headHTML('Agents')+`<div class="k-scroll"><div class="k-wrap ag-wrap">
  <div class="k-pagehead"><div style="display:flex;align-items:center;gap:.5rem">${ic('bot')}<h1 class="k-h1">Agents</h1><span class="k-count">${AGENTS.length}</span></div>
    <div class="ml">${t==='My agents'?`<div class="k-seg"><button class="${S.ag.layout==='cards'?'on':''}" data-ag="layout" data-arg="cards">${ic('layout-grid')}Cards</button><button class="${S.ag.layout==='table'?'on':''}" data-ag="layout" data-arg="table">${ic('list')}Table</button></div>`:''}
    <button class="k-btn k-btn--primary" data-act="New agents are created in chat. Ask Ana in Agentic mode, for example: every Monday, rank denial movers by payer">${ic('plus')}New agent</button></div></div>
  <div class="k-tabs">${[['My agents',AGENTS.length],['Approvals',pend],['Activity',null]].map(([n,c])=>`<button class="k-tab${t===n?' on':''}" data-ag="tab" data-arg="${n}">${n}${c!=null?`<span class="k-count">${c}</span>`:''}</button>`).join('')}</div>
  ${heroHTML()}${body}</div></div>`;
}
function myAgentsHTML(){
  const q=S.ag.q.trim().toLowerCase();
  const list=AGENTS.filter(a=>{const [k]=agStatus(a);if(q&&!(a.name+' '+a.instr).toLowerCase().includes(q))return false;
    return S.ag.chip==='All'||(S.ag.chip==='Running'&&k==='run')||(S.ag.chip==='Needs attention'&&(k==='warn'||k==='bad'))||(S.ag.chip==='Paused'&&k==='paused')});
  const tb=`<div class="ag-toolbar"><label class="k-search" style="flex:1 1 16rem;max-width:22rem">${ic('search')}<input id="agq" placeholder="Search agents" aria-label="Search agents" value="${esc(S.ag.q)}"></label>
    <div class="k-chips">${['All','Running','Needs attention','Paused'].map(c=>`<button class="k-chip${S.ag.chip===c?' on':''}" data-ag="chip" data-arg="${c}">${c}</button>`).join('')}</div></div>`;
  if(!list.length)return tb+`<div class="k-empty"><p class="k-empty__title">No agents match.</p><p>Clear the search or pick another filter.</p></div>`;
  if(S.ag.layout==='table')return tb+`<div class="ag-tablewrap"><table class="ag-table"><thead><tr><th>Agent</th><th>Status</th><th>Schedule</th><th>Next run</th><th>Last runs</th><th>Delivery</th><th></th></tr></thead><tbody>${list.map(a=>{const [k,l]=agStatus(a);
    return `<tr data-ag="open" data-arg="${a.id}"><td><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.instr)}</div></td><td><span class="ag-pill ${k}">${l}</span></td><td>${esc(schedText(a))}</td><td>${esc(nextText(a).replace(/^Next run /,''))}</td><td>${stripHTML(a)}</td><td>${delivText(a)}</td>
    <td class="acts"><button class="k-iconbtn" title="${a.status==='paused'?'Resume':'Pause'}" data-ag="pause" data-arg="${a.id}">${ic(a.status==='paused'?'play':'pause')}</button><button class="k-iconbtn" title="Edit" data-ag="edit" data-arg="${a.id}">${ic('pencil')}</button><button class="k-iconbtn" title="Activity" data-ag="activity" data-arg="${a.id}">${ic('activity')}</button><button class="k-iconbtn" title="Open map" data-ag="open" data-arg="${a.id}">${ic('map')}</button></td></tr>`}).join('')}</tbody></table></div>`;
  return tb+`<div class="ag-cards">${list.map(cardHTML).join('')}</div>`;
}
function cardHTML(a){
  const [k,l]=agStatus(a),live=LIVE[a.id],last=a.runs[0];
  const acts=S.ag.del===a.id?`<span class="ag-confirm">Delete this agent and its schedule?</span><span class="sp"></span><button class="ag-lnk" data-ag="delno">Cancel</button><button class="ag-lnk danger box" data-ag="delyes" data-arg="${a.id}">Delete</button>`
    :`<button class="ag-lnk danger" data-ag="del" data-arg="${a.id}">Delete</button><button class="ag-lnk" data-ag="pause" data-arg="${a.id}">${a.status==='paused'?'Resume':'Pause'}</button><span class="sp"></span>
      <button class="ag-lnk box" data-ag="edit" data-arg="${a.id}">${ic('pencil')}Edit</button><button class="ag-lnk" data-ag="activity" data-arg="${a.id}">Activity</button>${a.from?`<button class="ag-lnk" data-act="Opens the source conversation: ${a.from}">${ic('external-link')}</button>`:''}`;
  return `<article class="agc${live?' live':''}" data-ag="open" data-arg="${a.id}" tabindex="0" aria-label="Open ${esc(a.name)}">
    <div class="agc-top"><span class="agc-ic">${ic('bot')}</span><div class="agc-tt"><h3>${esc(a.name)}</h3><div class="agc-meta"><span class="k">Agent</span> · ${esc(schedText(a))}</div></div><span class="ag-pill ${k}">${l}</span></div>
    ${a.from?`<div class="agc-meta" style="margin-top:-.25rem">Created from an answer in ${esc(a.from)}</div>`:''}
    <p class="agc-instr">${esc(a.instr)}</p>
    <div class="agc-runs">${stripHTML(a)}<span>${live?'Running now · '+esc(nowLabel(live)):last?`Run #${last.num} · ${KIND[last.kind][1]} · ${esc(last.when)}`:'Not yet run'}</span></div>
    <div class="agc-foot"><span><b>${esc(nextText(a))}</b></span><span>${delivText(a)}</span></div>
    <div class="agc-acts">${acts}</div></article>`;
}
function nowLabel(r){const e=[...r.ev].reverse().find(e=>r.clock>=e.t);return e?STN[e.st].l:'starting'}

function agDetailHTML(){
  const a=agById(S.ag.id),[k,l]=agStatus(a),t=S.ag.dtab;
  const crumb=`<a data-ag="back">Agents</a></li><li>/</li><li class="cur">${esc(a.name)}`;
  const body=t==='Runs'?runsHTML(a):t==='Settings'?settingsHTML(a):liveHTML(a);
  return headHTML(crumb)+`<div class="k-scroll"><div class="k-wrap ag-wrap ag-wrap--wide">
  <div class="agd-head"><span class="agd-ic">${ic('bot')}</span><div class="agd-tt"><h1>${esc(a.name)}</h1>
    <div class="agd-meta"><span class="ag-pill ${k}">${l}</span><span>${ic('calendar')}${esc(schedText(a))}</span><span>${ic('clock')}${esc(nextText(a))}</span><span>${ic('mail')}${delivText(a)}</span>${a.from?`<button class="ag-lnk" style="height:22px" data-act="Opens the source conversation: ${a.from}">${ic('external-link')}${esc(a.from)}</button>`:''}</div></div>
    <div class="agd-acts"><button class="k-btn" data-ag="pause" data-arg="${a.id}">${ic(a.status==='paused'?'play':'pause')}${a.status==='paused'?'Resume':'Pause'}</button>
    <button class="k-btn k-btn--primary" data-ag="runnow" data-arg="${a.id}"${LIVE[a.id]?' disabled':''}>${ic('play')}${LIVE[a.id]?'Running':'Run now'}</button></div></div>
  <div class="k-tabs">${[['Live','Live map',null],['Runs','Runs',a.runs.length],['Settings','Settings',null]].map(([id,n,c])=>`<button class="k-tab${t===id?' on':''}" data-ag="dtab" data-arg="${id}">${n}${c!=null?`<span class="k-count">${c}</span>`:''}</button>`).join('')}</div>
  ${body}</div></div>`;
}
function tagHTML(){if(!PLAY)return '';return PLAY.live?`<b>Live</b><span>run #${PLAY.num}${PLAY.test?' · test with unsaved settings':''}</span>`:`<b>Replay</b><span>run #${PLAY.num} · ${KIND[PLAY.kind][1].toLowerCase()}</span>`}
function liveHTML(a){
  if(!PLAY||PLAY.a!==a)bindPlay();
  if(!PLAY)return `<div class="k-empty"><p class="k-empty__title">No runs yet.</p><p>Run now to watch this agent work.</p></div>`;
  return `<div class="agd-grid">
    <div class="ag-stage ag-stage--detail"><canvas id="agmap" role="img" aria-label="Map of what ${esc(a.name)} is doing"></canvas>
      <div class="ag-stagetag" id="agtag"></div><div class="ag-ov bl">${legendHTML()}</div>
      <div class="ag-ov br ag-hint">Spokes thicken with use · ring = token budget</div></div>
    <aside class="agd-side">
      <div class="ag-panel"><div class="ag-now" id="agnow"></div>
        <div class="ag-play"><div class="ag-playrow" id="agplaybar">${playBarHTML()}</div>
        <div class="ag-scrub${PLAY.live?' live':''}" data-agseek="1" role="slider" aria-label="Run position"><div class="ag-scrubfill" id="agprog"></div></div>
        <div class="ag-scrubt"><span id="agtime">0 ms</span><span>${fmtMs(PLAY.end)}</span></div></div></div>
      <div class="ag-panel ag-feed" id="agfeed"></div>
      <div class="ag-panel" id="agresult"></div>
    </aside></div>`;
}
function playBarHTML(){
  const r=PLAY;if(!r)return '';
  if(r.live)return `<span class="ag-livepill"><i></i>Live</span><span class="ag-pbinfo">Run #${r.num} · started by ${esc(r.ev[0].l.split(' · ')[0].toLowerCase())}</span>`;
  return `<button class="k-iconbtn" data-ag="play" title="${r.playing?'Pause':'Play'}">${ic(r.playing?'pause':'play')}</button><button class="k-iconbtn" data-ag="replay" title="Replay from the start">${ic('rotate-ccw')}</button>
    <div class="ag-speed">${[1,2,4].map(s=>`<button class="${r.speed===s?'on':''}" data-ag="speed" data-arg="${s}">${s}×</button>`).join('')}</div>
    <span class="ag-pbinfo">Replay · run #${r.num}</span>`;
}
function resultHTML(r){
  if(!runDone(r))return `<div class="ag-result"><h4>${ic('clock')}Result</h4><p style="margin:0;font-size:12.5px;color:#8d94ad">Findings appear here when the run finishes.</p></div>`;
  const a=r.a,p=a.plan,k=r.kind,outs=[];
  for(const e of r.ev){if(e.st==='library')outs.push(`<button class="ag-out" data-act="Opens ${esc(e.l.replace('Report · ',''))} in the Analytical library">${ic('file-text')}Report</button>`);
    if(e.st==='superset')outs.push(`<button class="ag-out" data-act="Opens the Superset dashboard: ${esc(e.l.replace('Dashboard · ',''))}">${ic('layout-dashboard')}Dashboard</button>`);
    if(e.st==='approvals'){const ap=APPROVALS.find(x=>x.what===e.l&&x.from===a.id);outs.push(`<button class="ag-out gov" data-ag="gotoap" data-arg="${ap?ap.id:''}">${ic('circle-check')}Approval${ap&&ap.decided?' · '+ap.decided:' · waiting'}</button>`)}}
  if(k==='budget')return `<div class="ag-result"><h4 class="bad">${ic('circle-alert')}Stopped at the token budget</h4>
    <p class="ag-notice">Hit the ${r.cfg.cap}K per-run cap while composing findings. Nothing was delivered. The run keeps its checkpoint.</p>
    <div class="outs"><button class="ag-out" data-ag="retry" data-arg="${a.id}">${ic('rotate-ccw')}Retry from checkpoint</button><button class="ag-out" data-ag="dtab" data-arg="Settings">${ic('settings')}Raise the cap</button></div></div>`;
  const find=k==='failed'?p.find.slice(0,2):p.find;
  return `<div class="ag-result"><h4 class="${k==='failed'?'warn':''}">${ic(k==='failed'?'circle-alert':'circle-check')}${k==='failed'?'Partial result':'What it found'}</h4>
    ${k==='failed'?`<p class="ag-notice">Not accessible: ${esc(p.gap)}. Findings below are partial context.</p>`:''}
    <ul>${find.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${outs.length?`<div class="outs">${outs.join('')}</div>`:''}</div>`;
}
function runsHTML(a){
  if(!a.runs.length)return `<div class="k-empty"><p class="k-empty__title">No runs yet.</p></div>`;
  return `<div class="ag-tablewrap"><table class="ag-table"><thead><tr><th>Run</th><th>Status</th><th>Trigger</th><th>Run time</th><th>Tokens</th><th>Headline</th><th>When</th><th></th></tr></thead><tbody>
  ${a.runs.map(h=>{hstat(a,h);const [k,l]=KIND[h.kind];const hl=headline(a,h);
   return `<tr data-ag="replayrun" data-arg="${h.num}"><td class="mono">#${h.num}</td><td><span class="ag-pill ${k}">${l}</span></td><td>${esc(a.plan.trig.split(' · ')[0])}</td><td class="mono">${fmtMs(h.secs*1000)}</td><td class="mono">${fmtK(h.tok)} / ${a.cap}K</td><td><div class="sub">${esc(hl)}</div></td><td>${esc(h.when)}</td><td class="acts"><button class="ag-lnk box" data-ag="replayrun" data-arg="${h.num}">${ic('play')}Replay on map</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function settingsHTML(a){
  if(!S.ag.draft||S.ag.draft.id!==a.id)S.ag.draft=cfgOf(a);
  const d=S.ag.draft,sw=(on,act,arg,lab)=>`<button class="swt${on?' on':''}" role="switch" aria-checked="${!!on}" aria-label="${lab}" data-ag="${act}" data-arg="${arg||''}"><i></i></button>`;
  const left=ARCH.filter(n=>!d.skills.includes(n));
  const sel=(path,opts,val,lab)=>`<select class="ae-sel" data-agf="${path}" aria-label="${lab}">${opts.map(([v,t])=>`<option value="${esc(String(v))}"${String(v)===String(val)?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
  const trig=d.triggers.map((t,i)=>t.type==='schedule'
    ?`<div class="ae-trig">${ic('calendar')}<b>Schedule</b>${sel(`triggers.${i}.freq`,Object.entries(FREQ),t.freq,'Frequency')}<span>at</span>${sel(`triggers.${i}.time`,TIMES.map(x=>[x,x]),t.time,'Time')}<span style="color:var(--k-muted);font-size:12px">America/Los_Angeles</span><button class="k-iconbtn x" title="Remove" data-ag="trigdel" data-arg="${i}">${ic('x')}</button></div>`
    :`<div class="ae-trig">${ic('zap')}<b>Event</b>${sel(`triggers.${i}.event`,Object.entries(AEVENTS),t.event,'Event')}${t.event==='threshold'?`${sel(`triggers.${i}.metric`,TMETRICS.map(x=>[x,x]),t.metric,'Metric')}${sel(`triggers.${i}.op`,[['above','above'],['below','below']],t.op,'Direction')}<input class="ae-in" data-agf="triggers.${i}.value" value="${esc(t.value||'')}" aria-label="Threshold">`:''}<button class="k-iconbtn x" title="Remove" data-ag="trigdel" data-arg="${i}">${ic('x')}</button></div>`).join('');
  return `<div class="ae">
  <section class="aesec"><h3>Name</h3><p>Shown on the map, in Activity and in every delivery</p><input class="ae-in" data-agf="name" value="${esc(d.name)}" aria-label="Agent name"></section>
  <section class="aesec"><h3>Instructions <span class="req">*</span></h3><p>What this agent should do, in plain words</p><textarea class="ae-ta" data-agf="instr" aria-label="Instructions">${esc(d.instr)}</textarea></section>
  <section class="aesec"><h3>Skills</h3><p>Analysis archetypes this agent uses for its tasks</p>
    ${d.skills.length?`<div class="ae-chips">${d.skills.map((n,i)=>`<span class="ae-chip">${ic('zap')}${esc(n)}<button data-ag="skilldel" data-arg="${i}" aria-label="Remove ${esc(n)}">${ic('x')}</button></span>`).join('')}</div>`:''}
    <span class="ae-menuwrap"><button class="ae-add" data-ag="menu" data-arg="skill"${left.length?'':' disabled'}>${ic('plus')}Add skill</button>${S.ag.menu==='skill'?`<div class="ae-menu" role="menu">${left.map(n=>`<button data-ag="skilladd" data-arg="${esc(n)}">${ic('zap')}${esc(n)}</button>`).join('')}</div>`:''}</span></section>
  <section class="aesec"><h3>Triggers <span class="req">*</span></h3><p>When this agent runs</p>${trig}
    <div class="ae-addrow"><button class="ae-add" data-ag="trigadd" data-arg="schedule">${ic('plus')}Add schedule</button><button class="ae-add" data-ag="trigadd" data-arg="event">${ic('plus')}Add event</button></div>
    <p class="ae-note">Each run uses tokens from your monthly budget</p></section>
  <section class="aesec"><h3>Capabilities</h3><p>What this agent can do with what it finds. Changes show on the map from the next run.</p>
    ${ATOOLS.map(([k,l,dsc,lock])=>`<div class="ae-tool"><div><b>${l}</b><p>${dsc}</p></div>${lock?'<span class="fixed">Always on</span>':sw(d.tools[k],'tool',k,l)}</div>`).join('')}
    <div class="ae-tool"><div><b>Web search</b><p>Not available. Kinetic answers only from governed data.</p></div><span class="fixed">Off</span></div>
    <div class="ae-tool"><div><b>Require approval before actions</b><p>Dashboards, recommendations and proposals wait for a person to approve them.</p></div>${sw(d.approval,'approval','','Require approval')}</div></section>
  <section class="aesec"><h3>Delivery</h3><p>Where results go after each run</p><div class="ae-deliv">
    <span class="ae-dchip on lock">${ic('check')}In Kinetic, always on</span>
    <button class="ae-dchip${d.email?' on':''}" data-ag="deliv" data-arg="email">${d.email?ic('check'):ic('mail')}Email to me</button>
    <button class="ae-dchip${d.slack?' on':''}" data-ag="deliv" data-arg="slack">${d.slack?ic('check'):ic('hash')}Slack · #rev-cycle-ops</button></div></section>
  <section class="aesec"><h3>Guardrails and memory</h3><p>Limits that keep runs predictable</p>
    <div class="ae-tool"><div><b>Token cap per run</b><p>Runs stop at the cap and keep a checkpoint you can resume from. Shown as the ring around the agent on the map.</p></div>${sel('cap',CAPS.map(c=>[c,c+'K tokens']),d.cap,'Token cap')}</div>
    <div class="ae-tool"><div><b>Remember previous runs</b><p>Compares each run with the last one and says what changed.</p></div>${sw(d.memory,'memory','','Remember previous runs')}</div></section>
  <section class="aesec ae-danger"><h3>Agent</h3><p>${a.status==='paused'?'Paused. No scheduled or event runs start until you resume it.':'Pausing lets a running run finish and stops new runs.'}</p>
    <div class="row"><button class="k-btn" data-ag="pause" data-arg="${a.id}">${ic(a.status==='paused'?'play':'pause')}${a.status==='paused'?'Resume agent':'Pause agent'}</button><button class="k-btn" style="color:var(--k-bad)" data-ag="del" data-arg="${a.id}">${ic('trash-2')}Delete agent</button>
    ${S.ag.del===a.id?`<span class="ag-confirm">Delete it and its schedule?<button class="ag-lnk" data-ag="delno">Cancel</button><button class="ag-lnk danger box" data-ag="delyes" data-arg="${a.id}">Delete</button></span>`:''}</div></section>
  </div>
  <div class="ae-bar"><span class="st${d.dirty?' dirty':''}" id="agdirty">${d.dirty?'Unsaved changes':'All changes saved'}</span><span class="sp"></span>
    <button class="k-btn k-btn--quiet" data-ag="discard" id="agdiscard"${d.dirty?'':' disabled'}>Discard</button>
    <button class="k-btn" data-ag="test" data-arg="${a.id}"${LIVE[a.id]?' disabled':''}>${ic('play')}Test agent</button>
    <button class="k-btn k-btn--primary" data-ag="save" id="agsave"${d.dirty?'':' disabled'}>Save changes</button></div>`;
}

/* approvals */
const SUP={'Directly supported':'ok','Calculated':'info','Assisted':'warn'};
function apRow(x){const a=agById(x.from);return `<button class="ap-row${S.ag.apSel===x.id?' on':''}${x.decided?' dec':''}" data-ag="apsel" data-arg="${x.id}"><b>${esc(x.what)}</b>
  <span class="m"><span>${esc(a?a.name:'Deleted agent')}</span><span class="ag-pill ${x.decided?(x.decided==='approved'?'ok':'paused'):SUP[x.support]}">${x.decided?(x.decided==='approved'?'Approved':'Rejected'):esc(x.support)}</span><span>${esc(x.age)}</span>${x.revs.length?`<span>${x.revs.length} change request${x.revs.length>1?'s':''}</span>`:''}</span></button>`}
function apChart(x){
  const n=x.series.length,max=Math.max(...x.series)*1.15||1,W=320,Hc=120,bw=26,gap=(W-24-n*bw)/(n-1);
  return `<svg class="ap-chart" viewBox="0 0 ${W} ${Hc+18}" role="img" aria-label="${esc(x.label)}">
   <line x1="12" x2="${W-12}" y1="${Hc}" y2="${Hc}" stroke="rgba(156,159,178,.35)"/>
   ${x.series.map((v,i)=>{const h=Math.max(2,v/max*(Hc-18)),X=12+i*(bw+gap),Y=Hc-h,hi=i===n-1;
     return `<path class="bar${hi?' hi':''}" d="M${X} ${Hc}V${Y+4}a4 4 0 0 1 4-4h${bw-8}a4 4 0 0 1 4 4V${Hc}Z"><title>Week ${39+i}: ${v}${x.unit}</title></path><text x="${X+bw/2}" y="${Hc+13}" text-anchor="middle">W${39+i}</text>${hi?`<text class="v" x="${X+bw/2}" y="${Y-5}" text-anchor="middle">${v}${x.unit}</text>`:''}`}).join('')}</svg>`;
}
function apDetail(x){
  const a=agById(x.from);
  return `<div class="ap-from"><span class="ag-pill ${SUP[x.support]}">${esc(x.support)}</span><span>From</span>${a?`<button data-ag="open" data-arg="${a.id}">${esc(a.name)}</button>`:'<span>Deleted agent</span>'}<span>· run #${x.run} · ${esc(x.age==='just now'?x.age:x.age+' ago')}</span></div>
  <h2>${esc(x.what)}</h2>
  <div class="ap-h">Evidence</div><p class="ap-why">${esc(x.why)}</p>
  <div class="ap-h">${esc(x.label)}</div>${apChart(x)}
  <div class="ap-h">Supporting figures</div><div class="ap-kv">${x.rows.map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>
  <div class="ap-h">What approving does</div><p class="ap-act">${esc(x.action)}</p>
  ${x.revs.length?`<ul class="ap-revs">${x.revs.map((r,i)=>`<li>Revision ${i+1}: “${esc(r)}”, sent to the agent</li>`).join('')}</ul>`:''}
  ${x.decided?`<div class="ap-done">${ic(x.decided==='approved'?'circle-check':'x')}<span>${x.decided==='approved'?'Approved. '+esc(a?a.name:'The agent')+' '+esc(x.done)+'.':'Rejected. Nothing was changed.'}</span><span style="flex:1"></span><button class="k-btn" data-ag="undo" data-arg="${x.id}">Undo</button></div>`
   :`<div class="ap-decide"><label class="ap-h" for="apnote" style="display:block;margin-top:0">Request a change (optional)</label><textarea class="ae-ta" id="apnote" placeholder="For example: only accounts over $5K, and skip Facility 19">${esc(S.ag.apNote)}</textarea>
     <div class="ap-btns"><button class="k-btn k-btn--primary" data-ag="approve" data-arg="${x.id}">${ic('check')}Approve</button><button class="k-btn" data-ag="change" data-arg="${x.id}">Send change request</button><button class="k-btn k-btn--quiet" data-ag="reject" data-arg="${x.id}">Reject</button></div></div>`}`;
}
function apHTML(){
  const pend=APPROVALS.filter(x=>!x.decided),dec=APPROVALS.filter(x=>x.decided);
  if(!APPROVALS.find(x=>x.id===S.ag.apSel))S.ag.apSel=(pend[0]||dec[0]||{}).id;
  const sel=APPROVALS.find(x=>x.id===S.ag.apSel);
  return `<div class="ap-grid"><div class="ap-list">${pend.length?pend.map(apRow).join(''):'<div class="k-empty"><p class="k-empty__title">Nothing waiting.</p><p>Agents send recommended actions here.</p></div>'}
    ${dec.length?`<div class="ap-sec">Decided</div>${dec.map(apRow).join('')}`:''}</div>
    <div class="ap-detail">${sel?apDetail(sel):'<div class="k-empty"><p>Select a recommendation.</p></div>'}</div></div>`;
}

/* activity */
function actHTML(){
  const all=[];AGENTS.forEach(a=>a.runs.forEach(h=>{hstat(a,h);all.push({a,h})}));all.sort((x,y)=>whenTs(y.h)-whenTs(x.h));const inMonth=h=>/Nov|Today/.test(h.when);
  const month=AGENTS.map(a=>({a,tok:a.runs.filter(inMonth).reduce((s,h)=>s+hstat(a,h).tok,0)})).sort((x,y)=>y.tok-x.tok);
  const used=month.reduce((s,x)=>s+x.tok,0),budget=8000,maxT=Math.max(...month.map(x=>x.tok))||1;
  const rows=all.filter(({a,h})=>(S.ag.actAgent==='all'||a.id===S.ag.actAgent)&&(S.ag.actStatus==='All'||(S.ag.actStatus==='Completed'&&h.kind==='ok')||(S.ag.actStatus==='Needs approval'&&h.kind==='needs')||(S.ag.actStatus==='Stopped'&&(h.kind==='budget'||h.kind==='failed'))));
  const live=Object.values(LIVE);
  return `<div class="ac-usage"><div class="ac-card"><h3>Tokens this month</h3><div class="ac-big">${fmtK(used)}<small>of ${fmtK(budget)}</small></div><div class="ac-track"><i style="width:${Math.min(100,used/budget*100).toFixed(1)}%"></i></div><p class="ac-note">${Math.round(used/budget*100)}% used · resets Dec 1 · team budgets live in User management</p></div>
    <div class="ac-card"><h3>By agent</h3><div class="ac-bars">${month.map(x=>`<button data-ag="actagent" data-arg="${x.a.id}">${esc(x.a.name)}</button><div class="b" style="width:${(x.tok/maxT*100).toFixed(1)}%" title="${esc(x.a.name)}: ${fmtK(x.tok)}"></div><span class="v">${fmtK(x.tok)}</span>`).join('')}</div></div></div>
  <div class="ag-toolbar"><select class="k-select" id="agactsel" aria-label="Agent"><option value="all">All agents</option>${AGENTS.map(a=>`<option value="${a.id}"${S.ag.actAgent===a.id?' selected':''}>${esc(a.name)}</option>`).join('')}</select>
    <div class="k-chips">${['All','Completed','Needs approval','Stopped'].map(c=>`<button class="k-chip${S.ag.actStatus===c?' on':''}" data-ag="actstatus" data-arg="${c}">${c}</button>`).join('')}</div></div>
  <div class="ag-tablewrap"><table class="ag-table"><thead><tr><th>Run · result</th><th>Agent</th><th>Status</th><th>Run time</th><th>Tokens</th><th>When</th><th></th></tr></thead><tbody>
  ${live.filter(r=>S.ag.actAgent==='all'||r.a.id===S.ag.actAgent).map(r=>`<tr data-ag="open" data-arg="${r.a.id}"><td><div class="nm">Run #${r.num}</div><div class="sub">In progress · ${esc(nowLabel(r))}</div></td><td>${esc(r.a.name)}</td><td><span class="ag-pill run">Running</span></td><td class="mono">-</td><td class="mono">-</td><td>Now</td><td class="acts"><button class="ag-lnk box" data-ag="open" data-arg="${r.a.id}">${ic('map')}Watch live</button></td></tr>`).join('')}
  ${rows.map(({a,h})=>{const [k,l]=KIND[h.kind];const hl=headline(a,h);
    return `<tr data-ag="replayof" data-arg="${a.id}:${h.num}"><td><div class="nm">Run #${h.num}</div><div class="sub">${esc(hl)}</div></td><td>${esc(a.name)}</td><td><span class="ag-pill ${k}">${l}</span></td><td class="mono">${fmtMs(h.secs*1000)}</td><td class="mono">${fmtK(h.tok)}</td><td>${esc(h.when)}</td><td class="acts"><button class="ag-lnk box" data-ag="replayof" data-arg="${a.id}:${h.num}">${ic('play')}Replay</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}

/* ---- events ---- */
function draftSet(path,val){const d=S.ag.draft;if(!d)return;const ks=path.split('.');let o=d;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=path==='cap'?+val:val;d.dirty=true}
function dirtyUI(){const d=S.ag.draft;if(!d)return;const s=el('agsave'),x=el('agdiscard'),t=el('agdirty');if(s)s.disabled=!d.dirty;if(x)x.disabled=!d.dirty;if(t){t.textContent=d.dirty?'Unsaved changes':'All changes saved';t.classList.toggle('dirty',!!d.dirty)}}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='agq'){S.ag.q=t.value;const p=t.selectionStart;agRender();const q=el('agq');if(q){q.focus();q.setSelectionRange(p,p)}return}
  if(t.id==='apnote'){S.ag.apNote=t.value;return}
  if(t.dataset&&t.dataset.agf&&t.tagName!=='SELECT'){draftSet(t.dataset.agf,t.value);dirtyUI()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='agactsel'){S.ag.actAgent=t.value;agRender();return}
  if(t.tagName==='SELECT'&&t.dataset.agf){draftSet(t.dataset.agf,t.value);if(/event$/.test(t.dataset.agf)){const i=+t.dataset.agf.split('.')[1];const tr=S.ag.draft.triggers[i];if(tr.event==='threshold'&&!tr.metric)Object.assign(tr,{metric:TMETRICS[0],op:'above',value:'10%'})}agRender()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('agc')&&e.target===document.activeElement){e.preventDefault();openAgent(e.target.dataset.arg)}});
document.addEventListener('mousemove',e=>{
  const cv=e.target.id==='agfleet'?e.target:null,tip=el('agtip');
  if(!cv){if(S.ag.hoverId){S.ag.hoverId=null;if(tip)tip.hidden=true}return}
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=26;
  for(const a of AGENTS){const p=cv._pos&&cv._pos[a.id];if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=a}}
  S.ag.hoverId=best?best.id:null;cv.style.cursor=best?'pointer':'default';
  if(tip){if(!best){tip.hidden=true;return}const [k,l]=agStatus(best),last=best.runs[0],run=LIVE[best.id];
    tip.innerHTML=`<b>${esc(best.name)}</b><span class="ag-pill ${k}" style="margin:.25rem 0">${l}</span><div class="m">${esc(schedText(best))}</div><div class="m">${run?'Now: '+esc(nowLabel(run))+' · '+Math.round(tokAt(run,run.clock)/run.cfg.cap*100)+'% tokens':last?'Last: run #'+last.num+' · '+KIND[last.kind][1]:'Not yet run'}</div>`;
    tip.hidden=false;const tw=tip.offsetWidth;tip.style.left=Math.min(r.width-tw-8,Math.max(8,x+16))+'px';tip.style.top=Math.max(8,y-10)+'px'}});
document.addEventListener('click',e=>{
  if(S.page!=='agents')return;
  if(S.ag.menu&&!e.target.closest('.ae-menuwrap')){S.ag.menu=null;agRender();return}
  if(e.target.id==='agfleet'){if(S.ag.hoverId)openAgent(S.ag.hoverId);return}
  const sk=e.target.closest('[data-agseek]');
  if(sk&&PLAY&&!PLAY.live){const r=sk.getBoundingClientRect();PLAY.clock=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*PLAY.end;if(PLAY.clock>=PLAY.end)PLAY.clock=PLAY.total;agFeedKey='';return}
  const b=e.target.closest('[data-ag]');if(!b)return;
  const act=b.dataset.ag,arg=b.dataset.arg,a=agById(arg);
  const go=()=>{const sc=document.querySelector('#page .k-scroll');render();if(sc){const s2=document.querySelector('#page .k-scroll');if(s2)s2.scrollTop=0}};
  switch(act){
    case 'tab':S.ag.tab=arg;S.ag.view='list';S.ag.del=null;agRender();break;
    case 'layout':S.ag.layout=arg;agRender();break;
    case 'chip':S.ag.chip=arg;agRender();break;
    case 'hero':S.ag.hero=!S.ag.hero;agRender();break;
    case 'open':openAgent(arg);break;
    case 'back':S.ag.view='list';S.ag.draft=null;go();break;
    case 'dtab':
      if(S.ag.dtab==='Settings'&&arg!=='Settings'&&S.ag.draft&&S.ag.draft.dirty)toast('Unsaved changes kept as a draft');
      S.ag.dtab=arg;S.ag.menu=null;agRender();break;
    case 'edit':openAgent(arg,'Settings');break;
    case 'activity':S.ag.view='list';S.ag.tab='Activity';S.ag.actAgent=arg;S.ag.actStatus='All';go();break;
    case 'actagent':S.ag.actAgent=S.ag.actAgent===arg?'all':arg;agRender();break;
    case 'actstatus':S.ag.actStatus=arg;agRender();break;
    case 'pause':if(!a)return;a.status=a.status==='paused'?'active':'paused';toast(a.status==='paused'?(LIVE[a.id]?'Paused. The current run finishes; no new runs start':'Paused. No new runs start'):`Resumed. ${nextText(a)}`);agRender();break;
    case 'del':S.ag.del=arg;agRender();break;
    case 'delno':S.ag.del=null;agRender();break;
    case 'delyes':{const i=AGENTS.findIndex(x=>x.id===arg);if(i<0)return;const n=AGENTS[i].name;AGENTS.splice(i,1);delete LIVE[arg];if(PLAY&&PLAY.a.id===arg)PLAY=null;S.ag.del=null;S.ag.view='list';toast('Deleted '+n);go();break}
    case 'runnow':case 'retry':if(!a)return;if(LIVE[a.id]){toast('Already running');return}
      PLAY=startLive(a,act==='retry'?'ok':null);S.ag.view='detail';S.ag.id=a.id;S.ag.dtab='Live';
      toast(act==='retry'?'Resuming from the checkpoint':a.status==='paused'?'Running once. The schedule stays paused':'Run started');agRender();break;
    case 'test':{if(!a)return;const d=S.ag.draft;if(LIVE[a.id]){toast('Already running');return}
      PLAY=startLive(a,d&&d.tools.recommend?'needs':'ok',{cfg:d?JSON.parse(JSON.stringify(d)):null,test:true});S.ag.dtab='Live';toast('Test run with the current settings. Nothing is delivered');agRender();break}
    case 'play':if(!PLAY)return;if(PLAY.clock>=PLAY.total){PLAY.clock=0}PLAY.playing=!PLAY.playing;agPlayUI();break;
    case 'replay':if(!PLAY)return;PLAY.clock=0;PLAY.playing=true;agFeedKey='';agPlayUI();break;
    case 'speed':if(!PLAY)return;PLAY.speed=+arg;agPlayUI();break;
    case 'replayrun':bindPlay(+arg);S.ag.dtab='Live';agRender();break;
    case 'replayof':{const [id,num]=arg.split(':');S.ag.view='detail';S.ag.id=id;S.ag.dtab='Live';bindPlay(+num);go();break}
    case 'gotoap':S.ag.view='list';S.ag.tab='Approvals';if(arg)S.ag.apSel=arg;go();break;
    case 'menu':S.ag.menu=S.ag.menu===arg?null:arg;agRender();break;
    case 'skilladd':S.ag.draft.skills.push(arg);S.ag.draft.dirty=true;S.ag.menu=null;agRender();break;
    case 'skilldel':S.ag.draft.skills.splice(+arg,1);S.ag.draft.dirty=true;agRender();break;
    case 'trigadd':S.ag.draft.triggers.push(arg==='schedule'?{type:'schedule',freq:'weekly',time:'7:00 AM'}:{type:'event',event:'remittance'});S.ag.draft.dirty=true;agRender();break;
    case 'trigdel':S.ag.draft.triggers.splice(+arg,1);S.ag.draft.dirty=true;agRender();break;
    case 'tool':S.ag.draft.tools[arg]=!S.ag.draft.tools[arg];S.ag.draft.dirty=true;agRender();break;
    case 'approval':S.ag.draft.approval=!S.ag.draft.approval;S.ag.draft.dirty=true;agRender();break;
    case 'memory':S.ag.draft.memory=!S.ag.draft.memory;S.ag.draft.dirty=true;agRender();break;
    case 'deliv':S.ag.draft[arg]=!S.ag.draft[arg];S.ag.draft.dirty=true;agRender();break;
    case 'discard':S.ag.draft=null;agRender();toast('Changes discarded');break;
    case 'save':{const d=S.ag.draft,ag=agById(d.id);if(!d.name.trim()||!d.instr.trim()){toast('Name and instructions are required');return}if(!d.triggers.length){toast('Add at least one trigger');return}
      Object.assign(ag,JSON.parse(JSON.stringify({name:d.name.trim(),instr:d.instr.trim(),skills:d.skills,triggers:d.triggers,tools:d.tools,approval:d.approval,cap:d.cap,email:d.email,slack:d.slack,memory:d.memory})));
      S.ag.draft=null;toast('Saved. Applies from the next run');agRender();break}
    case 'apsel':S.ag.apSel=arg;S.ag.apNote='';agRender();break;
    case 'approve':case 'reject':case 'change':{const x=APPROVALS.find(y=>y.id===arg);if(!x)return;const ag=agById(x.from),now=performance.now();
      if(act==='change'){const v=S.ag.apNote.trim();if(!v){toast('Type the change you want first');const t=el('apnote');if(t)t.focus();return}x.revs.push(v);S.ag.apNote='';FX.push({a:'approvals',b:x.from,t0:now,dur:1000,rgb:AGX.governance});toast('Change request sent to '+(ag?ag.name:'the agent'));agRender();break}
      x.decided=act==='approve'?'approved':'rejected';S.ag.apNote='';
      if(act==='approve'&&ag){FX.push({a:'approvals',b:x.from,t0:now,dur:1000,rgb:AGX.governance});FX.push({a:x.from,b:x.target,t0:now+1000,dur:1100,rgb:AGX[STN[x.target].h]});toast(`Approved. ${ag.name} ${x.done}`);setTimeout(()=>{const sc=document.querySelector('#page .k-scroll');if(sc&&S.ag.hero&&sc.scrollTop>200)sc.scrollTo({top:0,behavior:'smooth'})},50)}
      else toast(act==='approve'?'Approved':'Rejected. Nothing was changed');
      const nx=APPROVALS.find(y=>!y.decided);if(nx)S.ag.apSel=nx.id;agRender();break}
    case 'undo':{const x=APPROVALS.find(y=>y.id===arg);if(x){x.decided=null;toast('Back in the queue')}agRender();break}
  }
});
requestAnimationFrame(agLoop);
/* one agent is mid-run when the page opens, so the fleet map is alive from the first frame */
startLive(agById('ar90'),'ok',{clock:3600});
function agDrawNow(){const now=performance.now();const f=el('agfleet');if(f&&fitCanvas(f))drawFleet(f,now);const m=el('agmap');if(m&&PLAY&&fitCanvas(m))drawAgentMap(m,PLAY,now);agFeedKey='';agDomTick()}

render();
</script>
