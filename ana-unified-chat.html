<meta charset="utf-8">
<title>Ana Unified Chat Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: exact replica of the Kinetic/CHOC v2 shell (tokens, type, components extracted from the live staging app), with the Option 1 UX changes: Ana-first sidebar, Ask Ana docked panel on every page, full-screen chat, one conversation store. Single committed dark theme (Kinetic ships dark). */
:root{
  --k-bg:#262a40; --k-side:#191e31; --k-surface:#262a40; --k-raised:#32364f;
  --k-ink:#ffffff; --k-ink-2:#c4c7d7; --k-muted:#9c9fb2;
  --k-line:#32364f; --k-line-2:#484c63;
  --k-accent:#ee6d0b; --k-accent-ink:#ff8d40; --k-accent-soft:rgba(238,109,11,.2);
  --k-hover:rgba(255,141,64,.16); --k-hover-neutral:#484c63;
  --k-grad:linear-gradient(180deg,#EE6D0B 19%,#D35B00 100%); --k-on-grad:#050505;
  --k-ok:#7cc076; --k-warn:#e3a640; --k-bad:#ec7b7b; --k-info:#7fb0dc;
  --k-r:.5rem; --k-nav:14.75rem;
  --k-shadow-float:0 2px .5rem rgba(0,0,0,.5); --k-shadow-panel:0 0 1.25rem rgba(0,0,0,.25);
  --k-font:Inter,"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--k-line-2) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--k-line-2);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:#565b73}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-corner{background:transparent}
html{color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--k-bg);color:var(--k-ink);font-family:var(--k-font);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
::placeholder{color:var(--k-muted)}
svg.k-i{width:1rem;height:1rem;flex:0 0 auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- prototype bar ---------- */
#demobar{height:40px;display:flex;align-items:center;gap:12px;background:#0d101c;border-bottom:1px solid var(--k-line-2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none;font-size:12px;color:var(--k-muted)}
#demobar .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#demobar b{color:var(--k-ink);font-weight:600;font-size:12.5px}
#demobar .hint{margin-left:auto}
#demobar kbd{background:var(--k-raised);border:1px solid var(--k-line-2);border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--k-ink-2)}

/* ---------- frame ---------- */
#app{display:flex;height:calc(100% - 40px)}
#stage{flex:1;display:flex;min-width:0}
#page{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#panel{width:0;flex:none;background:var(--k-side);border-right:1px solid var(--k-line);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease;box-shadow:var(--k-shadow-panel)}
#panel.open{width:400px}
@media (max-width:900px){#sidebar{display:none!important}#panel.open{width:min(400px,88vw)}.canvas{position:fixed;inset:40px 0 0 0;width:auto!important;max-width:none!important;z-index:55}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}

/* ---------- sidebar (exact k-nav) ---------- */
.k-nav{width:var(--k-nav);flex:0 0 auto;height:100%;display:flex;flex-direction:column;gap:.25rem;padding:1rem .75rem 0;overflow:auto;background:var(--k-side);border-right:1px solid var(--k-line);color:var(--k-ink);font-size:.875rem}
.k-nav>*{flex-shrink:0}
.k-brand{display:flex;align-items:center;gap:.625rem;padding:2px .5rem .875rem;min-width:0}
.k-brand img{height:22px;width:auto;object-fit:contain;flex-shrink:0}
.k-brand__name{display:grid;min-width:0;font-size:.9375rem;font-weight:600;line-height:1.2}
.k-brand__client{font-size:.75rem;font-weight:500;color:var(--k-muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-iconbtn{width:1.875rem;height:1.875rem;flex:0 0 auto;display:grid;place-items:center;border-radius:.375rem;color:var(--k-muted)}
.k-iconbtn:hover{background:var(--k-hover);color:var(--k-ink)}
.k-brand__toggle{margin-left:auto}
.k-newchat{display:flex;align-items:center;gap:.625rem;margin-bottom:.5rem;padding:.625rem .75rem;cursor:pointer;border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface);color:var(--k-ink);font-weight:600;width:100%}
.k-newchat:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-navitem{display:flex;align-items:center;gap:.625rem;width:100%;cursor:pointer;border-radius:.375rem;color:var(--k-ink-2);padding:.5625rem .75rem;text-decoration:none}
.k-navitem:hover{background:var(--k-hover);color:var(--k-ink)}
.k-navitem.on{background:var(--k-accent-soft);color:var(--k-accent-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--k-accent)}
.k-navitem .kbd{margin-left:auto;font-size:.6875rem;color:var(--k-muted);font-weight:400}
.k-navsec{margin-top:1.125rem;padding:0 .75rem .375rem;font-size:.75rem;color:var(--k-muted)}
.k-navsec--link{display:flex;align-items:center;gap:.25rem;border-radius:.375rem;text-decoration:none;width:100%}
.k-navsec--link:hover{color:var(--k-ink)}
.k-navsec--link .k-i{width:.75rem;height:.75rem;opacity:0;transition:opacity .15s}
.k-navsec--link:hover .k-i{opacity:1}
.k-navempty{padding:2px .75rem;font-size:.75rem;color:var(--k-muted);margin:0}
.k-navlink{display:flex;align-items:center;gap:.5rem;width:100%;cursor:pointer;border-radius:.375rem;color:var(--k-ink-2);padding:.4375rem .75rem;font-size:.8125rem}
.k-navlink:hover{background:var(--k-hover);color:var(--k-ink)}
.k-navlink.on{color:var(--k-accent-ink)}
.k-navlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.k-navfoot{position:sticky;bottom:0;z-index:2;margin-top:auto;display:flex;align-items:center;gap:.25rem;padding:.625rem .25rem;background:var(--k-side);border-top:1px solid var(--k-line)}
.k-userbtn{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1;border-radius:.375rem;padding:.25rem}
.k-userbtn:hover{background:var(--k-hover)}
.k-avatar{width:1.75rem;height:1.75rem;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--k-raised);font-size:.6875rem;font-weight:700}
.k-who{flex:1 1 0%;min-width:0;font-size:.8125rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--k-ink)}
.k-who small{display:block;font-size:.7188rem;color:var(--k-muted);overflow:hidden;text-overflow:ellipsis}
.k-navfoot__tools{display:flex;align-items:center;gap:.125rem}

/* ---------- page header (exact) ---------- */
.k-head{position:relative;z-index:10;display:flex;height:3.5rem;flex-shrink:0;align-items:center;gap:.75rem;border-bottom:1px solid var(--k-line);background:var(--k-surface);box-shadow:0 1px 0 var(--k-line-2);padding:0 1.5rem}
.k-crumbs{font-size:13px;color:var(--k-muted);min-width:0}
.k-crumbs ol{display:flex;align-items:center;gap:.5rem;list-style:none;margin:0;padding:0}
.k-crumbs a{color:var(--k-muted);text-decoration:none;cursor:pointer}
.k-crumbs a:hover{color:var(--k-ink)}
.k-crumbs .cur{color:var(--k-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-btn{display:inline-flex;align-items:center;gap:.4375rem;height:2rem;padding:0 .875rem;border-radius:.375rem;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink);font-size:.8125rem;font-weight:600;white-space:nowrap;cursor:pointer}
.k-btn:hover{background:var(--k-hover);border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-btn--primary{background:var(--k-grad);color:var(--k-on-grad);border:0;box-shadow:rgba(0,0,0,.2) 0 0 .25rem}
.k-btn--primary:hover{background:var(--k-grad);color:var(--k-on-grad);filter:brightness(1.06)}
.k-btn--quiet{border-color:transparent;background:transparent;color:var(--k-ink-2)}
.k-btn--quiet:hover{background:var(--k-hover-neutral);color:var(--k-ink);border-color:transparent}
.k-btn kbd{font-family:ui-monospace,monospace;font-size:.6563rem;font-weight:400;color:inherit;opacity:.65}
.askana .dot{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--k-accent);box-shadow:0 0 5px var(--k-accent)}
.k-scroll{flex:1;overflow-y:auto;min-height:0}

/* ---------- page bodies (exact patterns) ---------- */
.k-wrap{margin:0 auto;width:100%;padding:1.5rem;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
.k-wrap--lib{max-width:80rem}
.k-wrap--std{max-width:71.25rem}
.k-h1-light{font-size:24px;font-weight:300;margin:0;letter-spacing:-.01em;text-wrap:balance}
.k-h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.015em;text-wrap:balance}
.k-sub{margin:.125rem 0 0;color:var(--k-muted);font-size:.875rem}
.k-pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem;margin-bottom:1.25rem}
.k-pagehead .ml{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.k-tabs{display:flex;gap:.25rem;box-shadow:inset 0 -1px 0 var(--k-line-2);margin-bottom:1rem}
.k-tab{padding:8px 12px;font-size:14px;color:var(--k-muted);display:inline-flex;align-items:center;gap:.4rem;border-bottom:2px solid transparent}
.k-tab:hover{color:var(--k-ink)}
.k-tab.on{color:var(--k-ink);font-weight:600;border-bottom-color:var(--k-accent)}
.k-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--k-hover-neutral);color:var(--k-ink);font-size:11px;font-weight:600}
.k-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.625rem;margin-bottom:1rem}
.k-chips{display:flex;flex-wrap:wrap;gap:.375rem}
.k-chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:16px;border:1px solid var(--k-line-2);background:transparent;color:var(--k-ink-2);font-size:12px;font-weight:600}
.k-chip:hover{color:var(--k-ink);border-color:var(--k-hover-neutral)}
.k-chip.on{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-on-grad)}
.k-search{display:inline-flex;align-items:center;gap:.5rem;height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-muted);min-width:12.5rem}
.k-search input{flex:1;min-width:0;color:var(--k-ink)}
.k-select{display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink-2);font-size:.8125rem}
.k-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:6px;border:1px solid var(--k-line-2);background:var(--k-side)}
.k-seg button{display:inline-flex;align-items:center;gap:.375rem;padding:4px 10px;border-radius:4px;font-size:.8125rem;color:var(--k-ink-2)}
.k-seg button.on{background:var(--k-grad);color:var(--k-on-grad);font-weight:600}
.k-card{border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface)}
.k-card__head{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-bottom:1px solid var(--k-line-2);font-size:.8125rem;font-weight:600}
.k-card__actions{margin-left:auto}
.k-empty{padding:1.75rem;text-align:center;color:var(--k-muted)}
.k-empty__title{color:var(--k-ink);font-weight:600;margin:0 0 .25rem}
.k-empty p{margin:0}
.k-librail{display:grid;min-width:0;grid-template-columns:minmax(0,1fr);content:start;align-content:start;gap:2px}
.k-librail button{display:flex;align-items:center;gap:.5rem;padding:.4375rem .625rem;border-radius:.375rem;font-size:.8125rem;color:var(--k-ink-2)}
.k-librail button.on{background:var(--k-accent-soft);color:var(--k-accent-ink);font-weight:600}
.k-librail button:not(.on):hover{background:var(--k-hover)}
.k-libgrid{display:grid;gap:1.25rem}
@media (min-width:1180px){.k-libgrid{grid-template-columns:13.75rem minmax(0,1fr)}}
.k-conv{display:flex;align-items:center;gap:.625rem;width:100%;padding:.6875rem .875rem;border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface);margin-bottom:.5rem}
.k-conv:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-conv .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-conv time{margin-left:auto;color:var(--k-muted);font-size:.75rem;flex:none}
.k-conv .st{font-size:.6875rem;color:var(--k-ok);border:1px solid var(--k-line-2);border-radius:999px;padding:1px 8px;flex:none}

/* ---------- Cerebrum: the stage fills everything the page controls leave free ---------- */
.cere-page{flex:1;min-height:0;display:flex;flex-direction:column}
/* the whole Cerebrum page sits on the stage's dark ground: header, title, tabs and toolbar share it, so only the sidebar is a separate surface */
#page.is-cere{--k-bg:#07080f;--k-surface:#0d0f1b;--k-side:#0d0f1b;--k-raised:#1a1d2e;--k-line:#1a1e30;--k-line-2:#2b3048;--k-hover-neutral:#22263a;background:var(--k-bg)}
#page.is-cere .k-head{background:var(--k-bg);box-shadow:none;border-bottom-color:var(--k-line)}
.cere-head{flex:none;padding:1.25rem 1.5rem 0;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
.cere-head .k-pagehead{margin-bottom:.75rem}
.cere-head .k-tabs{margin-bottom:0}
.cere-root{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--k-bg);container-type:inline-size}
.cere-bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;padding:.625rem 1.5rem;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
.cere-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--k-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cere-group{display:flex;align-items:center;gap:.5rem}
.cere-lbl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.09em;color:var(--k-muted)}
.cere-sp{flex:1}
.cere-find{box-sizing:border-box;height:2rem;flex:1 1 11rem;max-width:20rem;min-width:0;padding:0 .625rem;border-radius:.375rem;border:1px solid var(--k-line-2);background:var(--k-side);color:var(--k-ink);font-size:.8125rem}
/* every control in the bar is exactly 2rem tall */
.cere-bar .k-seg{box-sizing:border-box;height:2rem;align-items:stretch}
.cere-bar .k-seg button{padding-top:0;padding-bottom:0;line-height:1}
.cere-bar .k-btn{box-sizing:border-box;height:2rem}
.cere-find:focus{border-color:var(--k-accent)}
.cere-bar .k-seg button:focus-visible,.cere-bar .k-btn:focus-visible,.cere-find:focus-visible{outline:2px solid var(--k-accent-ink);outline-offset:1px}
.cere-stage{flex:1;min-height:12rem;position:relative}
.cere-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--k-bg)}
.cere-root:fullscreen{width:100vw;height:100vh}
@container (max-width:1210px){.cere-meta{display:none}}
@container (max-width:760px){.cere-sp{display:none}.cere-find{max-width:none}}

/* ---------- chat (home replica + thread) ---------- */
.chatwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.k-home{margin:0 auto;width:100%;max-width:51.25rem;padding:4.5rem 1.5rem 8.75rem}
.k-home--thread{padding:1.75rem 1.5rem 1rem}
#panel .k-home{padding:1rem 1rem 1.5rem;max-width:none}
.k-home__id{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.k-home__id img{height:34px;width:auto;object-fit:contain}
#panel .k-home__id img{height:24px}
.k-home__id small{display:block;font-size:.75rem;color:var(--k-muted);line-height:1.2}
.k-home__id b{font-size:.9375rem;line-height:1.2}
.k-home__title{font-size:28px;font-weight:300;margin:0 0 .375rem;text-wrap:balance}
.k-home__sub{margin:0 0 1.5rem;color:var(--k-muted);font-size:.875rem;max-width:46rem}
.k-composer{border:1px solid var(--k-line-2);border-radius:.5rem;background:var(--k-surface);padding:12px 12px 10px;box-shadow:var(--k-shadow-float)}
.k-composer:focus-within{border-color:var(--k-accent)}
.k-ctx{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.5rem}
.k-ctx:empty{display:none}
.k-ctxchip{display:inline-flex;align-items:center;gap:.375rem;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--k-line-2);background:var(--k-raised);color:var(--k-ink-2);font-size:11.5px}
.k-ctxchip .k-i{width:.75rem;height:.75rem;color:var(--k-accent-ink)}
.k-ctxchip button{display:grid;place-items:center;color:var(--k-muted);line-height:0}
.k-ctxchip button:hover{color:var(--k-ink)}
.k-ctxchip button .k-i{width:.7rem;height:.7rem;color:inherit}
.k-composer textarea{width:100%;resize:none;min-height:3rem;max-height:15rem;line-height:1.5;display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--k-line-2) transparent}
.k-composer textarea::-webkit-scrollbar{width:6px}
.k-composer textarea::-webkit-scrollbar-thumb{background:var(--k-line-2);border-radius:3px}
.k-composer textarea::-webkit-scrollbar-track{background:transparent}
#panel .k-composer textarea{min-height:3.4rem}
.k-comprow{display:flex;align-items:center;gap:.5rem;margin-top:.375rem}
.k-micbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink-2);display:grid;place-items:center}
.k-micbtn:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-modewrap{position:relative;margin-left:auto}
.k-modebtn{display:inline-flex;align-items:center;gap:.35rem;height:32px;padding:0 12px;border-radius:6px;background:var(--k-raised);color:var(--k-ink);font-size:.875rem;font-weight:600}
.k-modebtn:hover{filter:brightness(1.1)}
.k-modepop{position:absolute;bottom:calc(100% + 12px);right:0;min-width:13rem;background:#2b3047;border:1px solid var(--k-line-2);border-radius:.625rem;padding:.625rem;box-shadow:var(--k-shadow-float);z-index:40}
.k-modepop h5{margin:0 0 .5rem;padding:0 .25rem;font-size:.8125rem;font-weight:400;color:var(--k-muted)}
.k-modeopt{display:flex;align-items:center;gap:.75rem;width:100%;padding:.5rem .75rem;border-radius:.5rem;border:1.5px solid transparent;color:var(--k-ink);font-size:.9375rem}
.k-modeopt:hover{background:var(--k-hover)}
.k-modeopt.on{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-modeopt .mi{width:1rem;text-align:center;font-weight:600;font-size:.875rem}
.k-modeopt .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--k-accent)}
.k-modepop .foot{margin:.5rem 0 0;padding:0 .25rem;font-size:.8125rem;color:var(--k-muted)}
.k-modepop--down{bottom:auto;top:calc(100% + 12px)}
.k-sendbtn{width:32px;height:32px;border-radius:6px;background:var(--k-grad);color:var(--k-on-grad);display:grid;place-items:center}
.k-sendbtn:disabled{opacity:.45;cursor:not-allowed}
.k-home__hint{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:.5rem;font-size:.75rem;color:var(--k-muted)}
.k-home__prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.625rem;margin-top:1rem}
@media (max-width:640px){.k-home__prompts{grid-template-columns:1fr}}
#panel .k-home__prompts{grid-template-columns:1fr}
.k-home__prompt{text-align:left;padding:.75rem .875rem;line-height:1.4;border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface);color:var(--k-ink-2);font-size:.875rem}
.k-home__prompt:hover{color:var(--k-ink);box-shadow:var(--k-shadow-panel)}
.k-home__prompt small{display:block;margin-top:2px;font-size:.75rem;color:var(--k-muted)}

.srcitem .ttl{display:flex;align-items:flex-start;gap:.375rem;font-size:.875rem;font-weight:600;color:var(--k-ink);margin:.375rem 0 .25rem 1.625rem;line-height:1.4}
.srcitem .ttl .k-i{width:.75rem;height:.75rem;flex:none;margin-top:.2rem;color:var(--k-muted)}
.srcitem:hover .ttl,.srcitem:hover .ttl .k-i{color:var(--k-accent-ink)}
.srcitem .cell,.srcitem .valrow{display:block;margin-left:1.625rem;font-size:.8125rem;color:var(--k-ink-2);line-height:1.5}
.srcitem .valrow{color:var(--k-muted);margin-top:.125rem}
.srcitem .filts{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;margin:.3125rem 0 .25rem 1.625rem;font-size:.75rem;color:var(--k-ink-2)}
.srcitem .filts .fl{color:var(--k-muted);margin-right:.125rem}
.srcitem .filts code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--k-raised);padding:1px 6px;border-radius:4px;color:var(--k-ink);white-space:nowrap}
.srcitem .filts code span{color:var(--k-muted)}
.srcitem .val{color:var(--k-ink);font-weight:600;font-variant-numeric:tabular-nums}

/* data-access gap notice: always the first thing in an answer when Kinetic can't read what the question needs */
.gapnote{border:1px solid color-mix(in srgb,var(--k-bad) 55%,transparent);border-left:3px solid var(--k-bad);background:color-mix(in srgb,var(--k-bad) 9%,var(--k-surface));border-radius:.5rem;padding:.875rem 1rem;margin:0 0 1rem}
.gapnote .gh{display:flex;align-items:flex-start;gap:.5rem;font-size:.9375rem;font-weight:600;color:var(--k-ink);line-height:1.4}
.gapnote .gh .k-i{width:1.125rem;height:1.125rem;color:var(--k-bad);flex:none;margin-top:.0625rem}
.gapnote p{margin:.375rem 0 0 1.625rem;font-size:.875rem;line-height:1.6;color:var(--k-ink-2)}
.gapnote .gmiss{display:flex;flex-wrap:wrap;align-items:center;gap:.3125rem;margin:.625rem 0 0 1.625rem;font-size:.75rem;color:var(--k-muted)}
.gapnote .gmiss code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:1px 6px;border-radius:4px;color:var(--k-ink);background:var(--k-raised);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--k-bad) 70%,transparent)}
.gapnote .gacts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0 0 1.625rem}
.gapnote .gacts .k-btn{height:1.875rem;font-size:.75rem}
.prose .ctxh{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;font-size:1rem;font-weight:600;color:var(--k-ink);margin:.25rem 0 .5rem}
.prose .ctxh .tag{font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--k-bad);border:1px solid color-mix(in srgb,var(--k-bad) 50%,transparent);border-radius:999px;padding:1px 8px}
.prose table.ev{width:100%;border-collapse:collapse;margin:.5rem 0 .75rem;font-size:.8125rem}
.prose table.ev th{text-align:left;font-size:.6875rem;letter-spacing:.08em;color:var(--k-muted);font-weight:600;padding:.5rem .625rem;border-bottom:1px solid var(--k-line-2)}
.prose table.ev td{padding:.5rem .625rem;border-bottom:1px solid var(--k-line);color:var(--k-ink-2);font-variant-numeric:tabular-nums}
.prose table.ev td:first-child{color:var(--k-ink)}
.prose table.ev th:not(:first-child),.prose table.ev td:not(:first-child){text-align:right}

/* panel chrome */
.panelhead{display:flex;align-items:center;gap:.5rem;height:3.5rem;padding:0 .75rem;border-bottom:1px solid var(--k-line);box-shadow:0 1px 0 var(--k-line-2);flex:none}
.panelhead .k-i{color:var(--k-accent-ink)}
.panelhead .title{font-size:.8125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--k-raised);border:1px solid var(--k-line-2);border-radius:.5rem;padding:.5rem 1rem;font-size:.8125rem;box-shadow:var(--k-shadow-float);z-index:60}

/* ---------- Agents: lot-map style live maps on the Cerebrum stage ---------- */
:root{--cb-grounding:#5aa9ff;--cb-governance:#ffc45a;--cb-agent:#ab8cff;--cb-exec:#ff8c46;--cb-accent:#ff8a3d;--cb-good:#7ee0a0;--cb-bg:#07080f;
  --cb-display:"Chakra Petch","Inter",system-ui,sans-serif;--cb-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.ag-wrap{max-width:76rem}
.ag-wrap--wide{max-width:90rem}
.ag-stage{position:relative;overflow:hidden;border-radius:.75rem;border:1px solid rgba(140,150,190,.18);background:var(--cb-bg);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.ag-stage canvas{display:block;width:100%;height:100%}
.ag-hero{height:440px;margin-bottom:1.25rem}
.ag-hero canvas{cursor:default}
.ag-ov{position:absolute;z-index:2}
.ag-ov.tl{top:14px;left:16px}.ag-ov.tr{top:10px;right:10px}.ag-ov.bl{bottom:12px;left:16px}.ag-ov.br{bottom:12px;right:16px}
.ag-ovt{margin:0;font-family:var(--cb-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#e8ebf5}
.ag-ovs{margin:.125rem 0 0;font-family:var(--cb-mono);font-size:11px;color:#8d94ad}
.ag-hint{font-family:var(--cb-mono);font-size:10.5px;color:#5b6179}
.ag-hide{height:28px;color:#8d94ad}
.ag-legend{display:flex;flex-wrap:wrap;gap:.875rem;font-family:var(--cb-mono);font-size:10.5px;color:#8d94ad}
.ag-legend span{display:inline-flex;align-items:center;gap:.375rem}
.ag-legend i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.ag-herocollapsed{display:flex;align-items:center;gap:.5rem;width:100%;padding:.625rem .875rem;margin-bottom:1.25rem;border:1px dashed var(--k-line-2);border-radius:var(--k-r);color:var(--k-ink-2);font-size:.8125rem}
.ag-herocollapsed:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.ag-herocollapsed span{margin-left:auto;font-family:var(--cb-mono);font-size:11px;color:var(--k-muted)}
.ag-tip{position:absolute;z-index:3;pointer-events:none;min-width:220px;max-width:280px;padding:.625rem .75rem;border-radius:.5rem;background:rgba(12,14,24,.94);border:1px solid rgba(140,150,190,.25);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px;color:#c4c7d7}
.ag-tip b{display:block;color:#fff;font-size:13px;margin-bottom:.125rem}
.ag-tip .m{font-family:var(--cb-mono);font-size:10.5px;color:#8d94ad}

/* status pills */
.ag-pill{display:inline-flex;align-items:center;gap:.375rem;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.ag-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ag-pill.ok{color:var(--k-ok);background:rgba(124,192,118,.12);border-color:rgba(124,192,118,.3)}
.ag-pill.warn{color:var(--k-warn);background:rgba(227,166,64,.12);border-color:rgba(227,166,64,.3)}
.ag-pill.bad{color:var(--k-bad);background:rgba(236,123,123,.12);border-color:rgba(236,123,123,.3)}
.ag-pill.info{color:var(--k-info);background:rgba(127,176,220,.12);border-color:rgba(127,176,220,.3)}
.ag-pill.paused{color:var(--k-muted);background:rgba(156,159,178,.1);border-color:var(--k-line-2)}
.ag-pill.run{color:var(--cb-agent);background:rgba(171,140,255,.14);border-color:rgba(171,140,255,.4)}
.ag-pill.run::before{box-shadow:0 0 0 0 rgba(171,140,255,.7);animation:agping 1.4s infinite}
@keyframes agping{0%{box-shadow:0 0 0 0 rgba(171,140,255,.7)}100%{box-shadow:0 0 0 7px rgba(171,140,255,0)}}
@media (prefers-reduced-motion:reduce){.ag-pill.run::before,.ag-livepill i{animation:none}}

/* list toolbar */
.ag-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.625rem;margin-bottom:1rem}
.ag-sec{font-size:12px;font-weight:600;color:var(--k-ok);margin:0 0 .5rem}
.ag-sec span{color:var(--k-muted);font-weight:500;margin-left:.25rem}

/* cards */
.ag-cards{display:grid;gap:.875rem;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.agc{display:flex;flex-direction:column;gap:.625rem;padding:1rem;border:1px solid var(--k-line-2);border-radius:.625rem;background:var(--k-surface);cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.agc:hover{border-color:rgba(255,141,64,.6);box-shadow:0 0 0 1px rgba(255,141,64,.15),0 8px 24px rgba(0,0,0,.25)}
.agc:focus-visible{outline:2px solid var(--k-accent);outline-offset:2px}
.agc.live{border-color:rgba(171,140,255,.45);box-shadow:0 0 24px rgba(171,140,255,.12)}
.agc-top{display:flex;align-items:flex-start;gap:.75rem}
.agc-ic,.agd-ic{flex:none;display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:.5rem;background:rgba(238,109,11,.18);color:var(--k-accent-ink)}
.agc-tt{flex:1;min-width:0}
.agc-tt h3{margin:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-meta{font-size:12px;color:var(--k-muted);margin-top:.125rem}
.agc-meta .k{color:var(--k-accent-ink);font-weight:600}
.agc-instr{margin:0;font-size:13px;font-style:italic;color:var(--k-ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.agc-runs{display:flex;align-items:center;gap:.625rem;font-size:12px;color:var(--k-muted)}
.ag-strip{display:inline-flex;gap:3px}
.ag-strip i{width:8px;height:14px;border-radius:2px;background:var(--k-ok);opacity:.85}
.ag-strip i.needs{background:var(--k-warn)}.ag-strip i.budget{background:var(--k-bad)}.ag-strip i.failed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--k-bad)}
.agc-foot{font-size:12px;color:var(--k-muted);border-top:1px solid var(--k-line);padding-top:.625rem;display:flex;flex-wrap:wrap;gap:.25rem .75rem}
.agc-foot b{color:var(--k-ink-2);font-weight:500}
.agc-acts{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.agc-acts .sp{flex:1}
.ag-lnk{height:28px;padding:0 .5rem;border-radius:.375rem;font-size:12.5px;font-weight:600;color:var(--k-ink-2);display:inline-flex;align-items:center;gap:.375rem}
.ag-lnk:hover{background:var(--k-hover-neutral);color:var(--k-ink)}
.ag-lnk.danger{color:var(--k-bad)}
.ag-lnk.danger:hover{background:rgba(236,123,123,.14)}
.ag-lnk.box{border:1px solid var(--k-line-2)}
.ag-confirm{display:flex;align-items:center;gap:.5rem;font-size:12.5px;color:var(--k-bad)}

/* tables */
.ag-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--k-line-2);border-radius:.5rem;overflow:hidden}
.ag-table th{text-align:left;font-size:12px;font-weight:600;color:var(--k-muted);padding:.5rem .75rem;border-bottom:1px solid var(--k-line-2);background:rgba(25,30,49,.5);white-space:nowrap}
.ag-table td{padding:.625rem .75rem;border-bottom:1px solid var(--k-line);vertical-align:middle}
.ag-table tr:last-child td{border-bottom:0}
.ag-table tbody tr{cursor:pointer}
.ag-table tbody tr:hover td{background:rgba(255,255,255,.025)}
.ag-table .nm{font-weight:600}
.ag-table .sub{font-size:12px;color:var(--k-muted);max-width:28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-table .mono{font-family:var(--cb-mono);font-size:12px;color:var(--k-ink-2)}
.ag-table .acts{white-space:nowrap;text-align:right}
.ag-tablewrap{overflow-x:auto}

/* detail */
.agd-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.875rem;margin-bottom:1rem}
.agd-ic{width:3rem;height:3rem;border-radius:.625rem;background:var(--k-grad);color:var(--k-on-grad)}
.agd-ic svg{width:1.375rem;height:1.375rem}
.agd-tt{flex:1;min-width:16rem}
.agd-tt h1{margin:0;font-size:24px;font-weight:300;letter-spacing:-.01em}
.agd-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem 1rem;margin-top:.375rem;font-size:12.5px;color:var(--k-muted)}
.agd-meta>span:not(.ag-pill){display:inline-flex;align-items:center;gap:.375rem}
.agd-meta svg{width:.875rem;height:.875rem}
.agd-acts{display:flex;gap:.5rem}
.agd-grid{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
@media (max-width:1180px){.agd-grid{grid-template-columns:minmax(0,1fr)}}
.ag-stage--detail{height:clamp(480px,calc(100vh - 290px),720px)}
.ag-stagetag{position:absolute;top:12px;left:14px;z-index:2;font-family:var(--cb-mono);font-size:11px;color:#8d94ad;display:flex;align-items:center;gap:.5rem}
.ag-stagetag b{font-family:var(--cb-display);letter-spacing:.14em;text-transform:uppercase;color:#e8ebf5;font-size:12px;font-weight:600}
.agd-side{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.ag-panel{border:1px solid rgba(140,150,190,.18);border-radius:.625rem;background:#0c0e18;color:#c4c7d7}
.ag-now{padding:.75rem .875rem;font-family:var(--cb-mono);font-size:12px;line-height:1.5;color:#e8ebf5;min-height:3.25rem}
.ag-now small{display:block;color:#8d94ad;font-size:11px}
.ag-play{padding:.5rem .625rem .625rem;border-top:1px solid rgba(140,150,190,.12)}
.ag-playrow{display:flex;align-items:center;gap:.25rem;min-height:30px}
.ag-playrow .k-iconbtn{color:#c4c7d7}
.ag-speed{display:inline-flex;gap:2px;padding:2px;border-radius:5px;border:1px solid rgba(140,150,190,.2);margin-left:.25rem}
.ag-speed button{font-family:var(--cb-mono);font-size:11px;padding:1px 7px;border-radius:3px;color:#8d94ad}
.ag-speed button.on{background:rgba(255,138,61,.2);color:#ffb27a}
.ag-pbinfo{margin-left:auto;font-family:var(--cb-mono);font-size:11px;color:#8d94ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-livepill{display:inline-flex;align-items:center;gap:.375rem;font-family:var(--cb-mono);font-size:11px;font-weight:500;color:var(--cb-agent);padding:2px 8px;border:1px solid rgba(171,140,255,.4);border-radius:10px}
.ag-livepill i{width:6px;height:6px;border-radius:50%;background:var(--cb-agent);animation:agping 1.4s infinite}
.ag-scrub{position:relative;height:14px;margin-top:.375rem;cursor:pointer}
.ag-scrub::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:rgba(140,150,190,.18)}
.ag-scrub.live{cursor:default}
.ag-scrubfill{position:absolute;left:0;top:6px;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--cb-agent),var(--cb-accent));width:0}
.ag-scrubfill::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ffd9bd;box-shadow:0 0 8px var(--cb-accent)}
.ag-scrubt{display:flex;justify-content:space-between;font-family:var(--cb-mono);font-size:10.5px;color:#5b6179}
.ag-feed{padding:.375rem 0;font-family:var(--cb-mono);font-size:12px}
.ag-feedh{display:flex;justify-content:space-between;padding:.375rem .875rem .25rem;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5b6179}
.ag-row{display:grid;grid-template-columns:14px 84px minmax(0,1fr) auto;gap:.5rem;align-items:baseline;padding:.1875rem .875rem;color:#8d94ad}
.ag-row .g{text-align:center}
.ag-row .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-row .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c4c7d7}
.ag-row .tm{color:#5b6179;white-space:nowrap}
.ag-row.run .lb{color:#fff}
.ag-row.run .tm{color:#c4c7d7}
.ag-row.err .lb,.ag-row.err .st,.ag-row.err .g{color:#ff8a8a}
.ag-row.ans .lb{color:#ffd0ad}
.ag-row .more{color:#5b6179;margin-left:.375rem}
.ag-empty{padding:.75rem .875rem;color:#5b6179;font-family:var(--cb-mono);font-size:12px}
.ag-result{padding:.875rem}
.ag-result h4{margin:0 0 .5rem;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:.5rem}
.ag-result h4 svg{color:var(--cb-good)}
.ag-result h4.bad svg{color:var(--k-bad)}
.ag-result h4.warn svg{color:var(--k-warn)}
.ag-result ul{margin:0 0 .75rem;padding-left:1.1rem;font-size:13px;line-height:1.55;color:#c4c7d7}
.ag-result li+li{margin-top:.25rem}
.ag-result .outs{display:flex;flex-wrap:wrap;gap:.375rem}
.ag-out{display:inline-flex;align-items:center;gap:.375rem;height:28px;padding:0 10px;border-radius:.375rem;border:1px solid rgba(140,150,190,.25);font-size:12px;color:#e8ebf5}
.ag-out:hover{border-color:var(--cb-accent);color:#ffb27a}
.ag-out svg{width:.875rem;height:.875rem}
.ag-out.gov{border-color:rgba(255,196,90,.45)}
.ag-notice{margin:0 0 .75rem;padding:.5rem .625rem;border-radius:.375rem;font-size:12.5px;line-height:1.45;background:rgba(236,123,123,.1);border:1px solid rgba(236,123,123,.35);color:#ffb4b4}

/* settings (agent editor) */
.ae{max-width:52rem;margin:0 auto;padding-bottom:5rem}
.aesec{border:1px solid var(--k-line-2);border-radius:.625rem;padding:1.125rem;margin-bottom:1rem;background:var(--k-surface)}
.aesec h3{margin:0;font-size:14.5px;font-weight:600}
.aesec h3 .req{color:var(--k-bad)}
.aesec>p,.aesec-p{margin:.125rem 0 .875rem;font-size:13px;color:var(--k-muted)}
.ae-in,.ae-ta,.ae-sel{width:100%;border:1px solid var(--k-line-2);border-radius:.375rem;background:var(--k-side);color:var(--k-ink);padding:.5rem .625rem;font-size:13.5px}
.ae-ta{min-height:6.5rem;resize:vertical;line-height:1.5}
.ae-in:focus,.ae-ta:focus,.ae-sel:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 2px rgba(238,109,11,.25)}
.ae-sel{width:auto;padding:.3125rem .5rem;font-size:13px;cursor:pointer}
.ae-chips{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.625rem}
.ae-chip{display:inline-flex;align-items:center;gap:.375rem;height:28px;padding:0 6px 0 10px;border-radius:14px;background:rgba(171,140,255,.14);border:1px solid rgba(171,140,255,.35);font-size:12.5px;color:#d9ccff}
.ae-chip svg{width:.875rem;height:.875rem}
.ae-chip button{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#b9a8ef}
.ae-chip button:hover{background:rgba(255,255,255,.1);color:#fff}
.ae-add{display:inline-flex;align-items:center;gap:.375rem;font-size:13px;font-weight:600;color:var(--k-ink)}
.ae-add:hover{color:var(--k-accent-ink)}
.ae-add:disabled{color:var(--k-muted);cursor:default}
.ae-menuwrap{position:relative;display:inline-block}
.ae-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:15rem;padding:.25rem;border-radius:.5rem;border:1px solid var(--k-line-2);background:var(--k-raised);box-shadow:var(--k-shadow-float)}
.ae-menu button{display:flex;align-items:center;gap:.5rem;width:100%;padding:.4375rem .625rem;border-radius:.375rem;font-size:13px;color:var(--k-ink-2)}
.ae-menu button:hover{background:var(--k-hover);color:var(--k-ink)}
.ae-trig{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.5rem .625rem;border:1px solid var(--k-line);border-radius:.5rem;background:var(--k-side);margin-bottom:.5rem;font-size:13px}
.ae-trig b{font-weight:600;margin-right:.25rem}
.ae-trig .x{margin-left:auto}
.ae-trig input.ae-in{width:5.5rem;padding:.3125rem .5rem;font-size:13px}
.ae-addrow{display:flex;gap:1rem;flex-wrap:wrap}
.ae-note{margin:.625rem 0 0;font-size:12px;color:var(--k-muted)}
.ae-tool{display:flex;align-items:center;gap:1rem;padding:.6875rem 0;border-top:1px solid var(--k-line)}
.ae-tool:first-of-type{border-top:0}
.ae-tool div{flex:1;min-width:0}
.ae-tool b{display:block;font-size:13.5px;font-weight:600}
.ae-tool p{margin:.125rem 0 0;font-size:12.5px;color:var(--k-muted)}
.ae-tool .fixed{font-size:12.5px;color:var(--k-muted)}
.swt{flex:none;position:relative;width:38px;height:22px;border-radius:11px;background:var(--k-hover-neutral);transition:background .15s}

const EA=[], EB=[];
kinds.forEach(k=>{ const m=Math.min(Math.round(k.count*1.1),1800); for(let i=0;i<m;i++){ const a=k.start+Math.floor(rnd()*k.count), b=k.start+Math.floor(rnd()*k.count); if(a!==b){EA.push(a);EB.push(b);} } });

}

  if(!(li>=0)) li=Math.floor(Math.random()*4); if(!isFinite(speed)) speed=0.001; if(!isFinite(x)) x=W/2; if(!isFinite(amp)) amp=1;

  src.forEach(s=>{add(0,'p:'+prodOf(s),prodOf(s)).items.push(s);add(1,'k:'+s.kind,s.kind).items.push(s);add(2,'s:'+s.n,s.ttl).items.push(s)});

  cols.forEach(col=>{const tot=src.length*unit+pad*(col.length-1);let y=top+(usable-tot)/2;col.forEach(n=>{n.y=y;n.h=n.items.length*unit;y+=n.h+pad})});
  const yOf=(ci,s)=>{const n=cols[ci].find(x=>x.items.includes(s));return n.y+n.items.indexOf(s)*unit};
  const g=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
  const paths=new Map();

      const c0=y0+unit/2,c1=y1+unit/2;

    }

  });
  cols.forEach((col,ci)=>col.forEach(n=>{

    if(isS){r.setAttribute('style','fill:var(--t)');r.dataset.n=s0.n}
    r.dataset.tip=isS?`${n.label}|${TIERS[s0.tier].name}|${s0.tier}`:`${n.label}|${n.items.length} source${n.items.length>1?'s':''}|`;
    svg.appendChild(r);
    const maxc=isS?Math.floor((W/2-46)/6.1):Math.floor((W/2-36)/2/6.1);
    const lab=n.label.length>maxc?n.label.slice(0,maxc-1)+'…':n.label;
    const t=g('text',{x:ci===0?colX[ci]+cw+6:colX[ci]-6,y:n.y+n.h/2+3.5,'text-anchor':ci===0?'start':'end',class:isS?'s':''});t.textContent=lab;svg.appendChild(t);
  }));
  ['DATA PRODUCT','KIND','CITED CELL'].forEach((lab,i)=>{const t=g('text',{class:'col',x:colX[i]+(i===2?cw:0),y:14,'text-anchor':i===2?'end':i===1?'middle':'start'});if(i===1)t.setAttribute('x',colX[1]+cw/2);t.textContent=lab;svg.appendChild(t)});
  const tip=el('trtip');
  const setHover=n=>{traceHover=n;svg.classList.toggle('hl',n!=null);svg.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x.dataset.n==n))};
  svg.onmousemove=e=>{
    const t=e.target.closest('[data-n],[data-tip]');
    setHover(t&&t.dataset.n?t.dataset.n:null);
    const tp=e.target.closest('rect[data-tip]');
    if(tp){const [l,sub,tier]=tp.dataset.tip.split('|');tip.className='trtip'+(tier?' tier-'+tier:'');tip.innerHTML=`${esc(l)} · <span>${esc(sub)}</span>`;const b=svg.parentNode.getBoundingClientRect();tip.style.display='block';const x=e.clientX-b.left+12;tip.style.left=Math.min(x,b.width-tip.offsetWidth-6)+'px';tip.style.top=(e.clientY-b.top+14)+'px'}else tip.style.display='none';
  };
  svg.onmouseleave=()=>{setHover(null);tip.style.display='none'};
  svg.onclick=e=>{const t=e.target.closest('[data-n]');if(!t)return;const n=+t.dataset.n;S.canvas.view='list';S.canvas.focus=n;traceHover=null;S.keepScroll=true;render();requestAnimationFrame(()=>{const f=el('src-'+n);if(f)f.scrollIntoView({block:'nearest'})})};
  const fire=s=>{const sv=el('trace');if(!sv)return;const r=paths.get(s.n);const c=g('circle',{r:3.4,class:'imp tier-'+s.tier});c.style.offsetPath=`path("${r.d}")`;c.style.setProperty('--d',(1.6+r.len/180).toFixed(2)+'s');c.addEventListener('animationend',()=>c.remove());sv.appendChild(c)};

  const tick=()=>{if(el('trace')!==svg)return;const pool=traceHover!=null?src.filter(s=>s.n==traceHover):src;fire(pool[Math.floor(Math.random()*pool.length)]);traceTimer=setTimeout(tick,900+Math.random()*1400)};

}

const RUNSTEPS=['Understanding request','Matching analysis archetype','Resolving terms','Discovering data','Running queries','Composing findings','Working on next steps'];
function runHTML(m){
  const idx=S.thread.indexOf(m);
  const elapsed=((m.end||Date.now())-m.start)/1000;
  const t=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
  const header=m.stopped?`<span class="ttl"><b>Kinetic</b> stopped at step ${m.cur+1} of 7</span>`
    :m.done?`<span class="ttl"><b>Kinetic</b> worked on ${esc(m.arch)}</span>`
    :m.cur===0?`<span class="ttl"><b>Kinetic</b> is starting</span>`
    :`<span class="ttl"><b>Kinetic</b> is working on ${esc(m.arch)}</span>`;
  const bar=`<div class="runbar">${RUNSTEPS.map((_,j)=>`<i class="${(m.done&&!m.stopped)||j<m.cur?'d':(!m.done&&j===m.cur)?'c':''}"></i>`).join('')}</div>`;
  const toggle=`<button class="runtoggle" data-runtoggle="${idx}">${m.expanded?'Hide':'Show'} details ${ic(m.expanded?'chevron-up':'chevron-down')}</button>`;
  const line=m.done
    ?`<div class="runline"><span>${m.stopped?'Stopped':'Done'} · ${elapsed.toFixed(1)} s</span>${toggle}</div>`
    :`<div class="runline"><span class="spin"></span><span>Step ${m.cur+1} of 7, <b>${RUNSTEPS[m.cur]}</b></span>${toggle}</div>`;
  const steps=m.expanded?`<div class="runsteps">${RUNSTEPS.map((nm,j)=>{
    const done=(m.done&&!m.stopped)||j<m.cur;
    const cur=!m.done&&j===m.cur;
    let sub='';
    if(j===0)sub=cur?'Thinking through your request':done?'“'+esc(m.q)+'”':'';
    if(j===1&&done)sub=`<span style="color:var(--k-ink);font-weight:600">${esc(m.arch)}</span><span class="sub">${esc(m.metrics)} · ${m.period}</span>`;
    if(j===4&&cur)sub='3 queries run so far';
    return `<div class="runstep${cur?' cur':''}${done?' done':''}">
      <span class="si">${done?`<span class="ok">${ic('check')}</span>`:cur?`<span class="spin"></span>`:`<span class="pend"></span>`}</span>
      <span style="min-width:0;flex:1"><span class="nm">${nm}</span>${sub?`<span class="sub">${sub}</span>`:''}</span>
      ${done&&m.durs[j]?`<span class="dur">${m.durs[j]} s</span>`:''}
    </div>`}).join('')}</div>`:'';
  const skel=m.done?'':`
    <div class="skh">Understood</div><div class="sk" style="width:62%"></div><div class="sk" style="width:84%"></div><div class="sk" style="width:71%"></div>
    <div class="skh">Evidence</div><div class="skboxes"><i></i><i></i><i></i></div><div class="sk"></div><div class="sk" style="width:78%"></div>
    <div class="skh">Finding</div><div class="sk" style="width:80%"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:58%"></div>`;
  return `<div class="runcard" style="--shd:-${Date.now()%1800}ms"><div class="runhead"><span class="kmark">K</span>${header}<span class="time">${t}</span></div>${bar}${line}${steps}${skel}</div>`;
}

  const tas=root.querySelectorAll('.cinput');

  if(ta)ta.focus();
}

/* Cerebrum page. The stage is the real Cerebrum canvas, mounted once in an iframe (source inlined below in
   #cerebrum-src) so it keeps running while the rest of the page re-renders. The toolbar lives here, in Kinetic
   controls, and talks to the stage with postMessage; the stage reports its mode, edit state and counts back. */
const CERE_MODES=[['Lobe','lobe'],['Region','region'],['Kind','kind'],['Scope','scope']];
const CERE_HOST={theme:'dark',stage:{stageIn:'#0b0d1a',stageMid:'#090b15',stageOut:'#07080f'}};

function cerebrumHTML(){
  return headHTML('Cerebrum')+`<div class="cere-page">
  <div class="cere-head">
    <div class="k-pagehead"><div><h1 class="k-h1">Cerebrum</h1><p class="k-sub">What Kinetic knows, and what is waiting to be reviewed.</p></div>
      <button class="k-btn k-btn--quiet" style="margin-left:auto" data-act="Settings are not part of this prototype">${ic('chart-column')}Metric library is in Settings</button></div>
    <div class="k-tabs">${['Kinetic graph','Archetypes','Data coverage','Proposals'].map(t=>`<button class="k-tab${S.cereTab===t?' on':''}" data-ceretab="${t}">${t}${t==='Proposals'?'<span class="k-count">0</span>':''}</button>`).join('')}</div>
  </div>
  <div class="cere-root" id="cereRoot">

    <div class="cere-stage"><iframe id="cereFrame" title="Cerebrum graph" allow="fullscreen"></iframe></div>
  </div></div>`;
}
function cereMount(){
  const f=el('cereFrame');if(!f)return;
  const src=el('cerebrum-src').textContent.replace(/<\\(\/?script|!--)/g,'<$1');
  f.srcdoc='<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>window.CEREBRUM_HOST='+JSON.stringify(CERE_HOST)+'<\/script></head><body>'+src+'</body></html>';
}
function cerePost(o){const f=el('cereFrame');if(f&&f.contentWindow)f.contentWindow.postMessage(Object.assign({target:'cerebrum'},o),'*')}
function cereSync(){
  const bar=el('cereBar');if(!bar)return;
  const m=el('cereMeta');if(m&&m.textContent!==S.cereMeta)m.textContent=S.cereMeta;
  bar.querySelectorAll('[data-ceregroup]').forEach(b=>{const on=b.dataset.ceregroup===S.cereGroup;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  bar.querySelectorAll('[data-cereedit]').forEach(b=>{const on=(b.dataset.cereedit==='1')===S.cereEdit;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  const fs=el('cereFs');if(fs){const want=S.cereFs?'Exit full screen':'Full screen';if(fs.textContent.trim()!==want)fs.innerHTML=ic(S.cereFs?'minimize-2':'maximize-2')+want}
}
window.addEventListener('message',e=>{
  const d=e.data,f=el('cereFrame');if(!d||d.source!=='cerebrum'||!f||e.source!==f.contentWindow)return;
  if(d.type==='ready'){const m=CERE_MODES.find(x=>x[0]===S.cereGroup);if(m&&m[1]!=='lobe')cerePost({cmd:'mode',mode:m[1]});if(S.cereEdit)cerePost({cmd:'edit',on:true})}
  if(d.type==='state'){const m=CERE_MODES.find(x=>x[1]===d.mode);if(m)S.cereGroup=m[0];S.cereEdit=!!d.edit;
    S.cereMeta=`${d.neurons.toLocaleString()} neurons · ${d.kinds} kinds · ${d.synapses.toLocaleString()} synapses`;cereSync()}
});
document.addEventListener('fullscreenchange',()=>{S.cereFs=!!document.fullscreenElement&&document.fullscreenElement.id==='cereRoot';cereSync()});

  if(S.canvas&&S.canvas.type==='sources'&&S.canvas.view==='trace')requestAnimationFrame(drawTrace);else clearTimeout(traceTimer);

/* ============ chat engine ============ */
function send(text){
  text=(text||'').trim();
  if(!text||S.streaming)return;
  if(!S.thread.length)S.threadTitle=text.length>46?text.slice(0,44)+'…':text;
  S.thread.push({role:'user',text});
  const ans=/129|N770|CARC|RARC|drug/i.test(text)?CANNED.gap:/deni|payer/i.test(text)?CANNED.denied:/cash|goal/i.test(text)?CANNED.cash:CANNED.generic;
  const run={role:'run',cur:0,done:false,stopped:false,expanded:false,start:Date.now(),durs:[],q:text,arch:ans.arch,metrics:ans.metrics,period:ans.period};
  S.thread.push(run);
  S.streaming=true;
  render();
  const durms=[1300,600,500,700,1100,800,600];
  let j=0,stepStart=Date.now();
  run.timer=setInterval(()=>{
    if(run.stopped){clearInterval(run.timer);return}
    if(Date.now()-stepStart>=durms[j]){
      run.durs[j]=((Date.now()-stepStart)/1000).toFixed(1);
      j++;stepStart=Date.now();
      if(j>=durms.length){
        clearInterval(run.timer);
        run.done=true;run.cur=6;run.end=Date.now();
        S.thread.push({role:'ana',answer:ans,secs:((run.end-run.start)/1000).toFixed(1)});
        S.streaming=false;
        render();focusComposer();
        return;
      }
      run.cur=j;
    }
    render();
  },250);
}
function newChat(){
  if(S.thread.length)S.lastThread={title:S.threadTitle,thread:S.thread};
  S.thread=[];S.threadTitle='New conversation';S.canvas=null;S.chips=S.panelOpen&&pageCtx()?[pageCtx()]:[];
}

  if(!S.lastThread)return;

  S.threadTitle=S.lastThread.title;S.thread=S.lastThread.thread;
}

  if(o.pct!=null){const rr=r+8;g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=4;g.beginPath();g.arc(x,y,rr,0,6.284);g.stroke();
    const col=o.pct>=.9?AGX.bad:o.pct>=.7?AGX.governance:AGX.accent;g.strokeStyle=`rgb(${col})`;g.lineCap='round';g.beginPath();g.arc(x,y,rr,-Math.PI/2,-Math.PI/2+Math.max(.001,Math.min(1,o.pct))*6.283);g.stroke();g.lineCap='butt';
    if(o.pct>.02)halo(g,x+Math.cos(-Math.PI/2+Math.min(1,o.pct)*6.283)*rr,y+Math.sin(-Math.PI/2+Math.min(1,o.pct)*6.283)*rr,10,col,.6)}
  g.textAlign='center';g.textBaseline='alphabetic';
  if(o.top){g.fillStyle=o.topCol||'rgba(232,235,245,.62)';g.font='500 10px "JetBrains Mono",monospace';g.fillText(o.top,x,y-r*.36)}
  g.fillStyle='#fff';g.font=`600 ${o.big||15}px "Chakra Petch","Inter",sans-serif`;if('letterSpacing' in g)g.letterSpacing='1.5px';g.fillText(o.title,x,y+5);if('letterSpacing' in g)g.letterSpacing='0px';

function drawStation(g,x,y,st,o){

    g.strokeStyle=`rgba(${rgb},.45)`;g.lineWidth=1;g.beginPath();g.arc(x,y,r+9,-Math.PI/2,-Math.PI/2+((o.elapsed%60000)/60000)*6.283+.02);g.stroke();g.lineCap='butt'}
  g.textAlign='center';g.textBaseline='alphabetic';g.font='500 11px "JetBrains Mono",monospace';g.fillStyle=o.act?'#fff':`rgba(232,235,245,${.78*dim})`;g.fillText(STN[st].l,x,y+r+18);
  if(o.count!=null){g.font='10px "JetBrains Mono",monospace';g.fillStyle=`rgba(141,148,173,${.95*dim})`;g.fillText(o.count,x,y+r+31)}
  if(o.par>1){const bx=x+r*.78,by=y-r*.78;g.fillStyle='#0c0e18';g.beginPath();g.arc(bx,by,9,0,6.284);g.fill();g.strokeStyle=`rgba(${rgb},.9)`;g.lineWidth=1.2;g.stroke();g.fillStyle='#fff';g.font='600 9px "JetBrains Mono",monospace';g.fillText('×'+o.par,bx,by+3)}
  if(o.err){const bx=x-r*.78,by=y-r*.78;g.fillStyle='rgb(236,90,90)';g.beginPath();g.arc(bx,by,8,0,6.284);g.fill();g.fillStyle='#fff';g.font='600 9px "JetBrains Mono",monospace';g.fillText(o.err,bx,by+3)}

/* ---- per-agent run map ---- */
function drawAgentMap(cv,run,now){
  const g=cv.getContext('2d'),W=cv._w,H=cv._h;g.setTransform(DPR,0,0,DPR,0,0);
  const cx=W/2,cy=H/2+6,R=Math.max(90,Math.min(W/2-66,H/2-60)),c=run.clock,done=runDone(run);
  stageBg(g,W,H,cv,now,done?.4:1,cx,cy);
  const pos={};RING.forEach((st,i)=>{const a=-Math.PI/2+i/RING.length*6.283;pos[st]=[cx+Math.cos(a)*R,cy+Math.sin(a)*R*.94]});
  const used=new Set(run.ev.map(e=>e.st));
  const S_={};RING.forEach(st=>S_[st]={uses:0,act:0,err:0,flash:0,el:null,lastEnd:-1e9});
  for(const e of run.ev){if(c<e.t)continue;const s=S_[e.st];s.uses++;if(e.dur&&c<e.t+e.dur){s.act++;s.el=Math.max(s.el||0,c-e.t)}
    if(e.err)s.err++;const end=e.t+e.dur;if(c>=end)s.lastEnd=Math.max(s.lastEnd,end)}
  const coreR=Math.max(30,Math.min(54,R*.22));
  // worn spokes
  for(const st of RING){const s=S_[st],[x,y]=pos[st],rgb=AGX[STN[st].h];const dx=x-cx,dy=y-cy,L=Math.hypot(dx,dy);
    const a0=[cx+dx/L*(coreR+10),cy+dy/L*(coreR+10)],a1=[x-dx/L*24,y-dy/L*24];
    const gr=g.createLinearGradient(a0[0],a0[1],a1[0],a1[1]);const al=(.08+Math.min(.42,s.uses*.07))*(used.has(st)?1:.5);
    gr.addColorStop(0,`rgba(255,138,61,${al*.8})`);gr.addColorStop(1,`rgba(${rgb},${al})`);
    g.strokeStyle=gr;g.lineWidth=1+Math.min(4,Math.log2(1+s.uses)*1.3);g.beginPath();g.moveTo(a0[0],a0[1]);g.lineTo(a1[0],a1[1]);g.stroke()}
  // route: the last few stations the run went through, newest leg draws itself, older legs fade
  const seq=[];for(const e of run.ev){if(c<e.t||e.st==='kinetic'||e.st==='you')continue;if(!seq.length||seq[seq.length-1].st!==e.st)seq.push({st:e.st,t:e.t})}
  for(let i=Math.max(1,seq.length-5);i<seq.length;i++){const A=pos[seq[i-1].st],B=pos[seq[i].st],age=c-seq[i].t;const al=age<9000?1:Math.max(0,1-(age-9000)/5000);if(al<=0)continue;
    const f=qp(A,B,-Math.hypot(B[0]-A[0],B[1]-A[1])*.22);g.strokeStyle=`rgba(255,214,170,${.38*al})`;g.lineWidth=1.2;g.setLineDash([2,4]);curve(g,f,0,Math.min(1,age/650));g.stroke();g.setLineDash([])}
  // impulses: out when a call starts, back when it ends
  for(const e of run.ev){const B=pos[e.st];const dx=B[0]-cx,dy=B[1]-cy,L=Math.hypot(dx,dy);
    const A=[cx+dx/L*(coreR+6),cy+dy/L*(coreR+6)],B2=[B[0]-dx/L*22,B[1]-dy/L*22];const bend=e.par>1?(e.pi-(e.par-1)/2)*26:L*.06;
    const rgb=AGX[STN[e.st].h];const uo=(c-e.t)/TRAVEL;if(uo>=0&&uo<=1&&!e.msg)impulse(g,qp(A,B2,bend),ease(uo),e.st==='you'?AGX.accent:rgb);
    if(e.msg){const ui=(c-e.t)/TRAVEL;if(ui>=0&&ui<=1)impulse(g,qp(B2,A,-bend),ease(ui),AGX.you)}
    const ub=(c-e.t-e.dur)/TRAVEL;if(e.dur&&ub>=0&&ub<=1)impulse(g,qp(B2,A,-bend),ease(ub),e.err?AGX.bad:rgb)}
  // kinetic (model) station also gets its own impulses
  // emanation when the answer is ready (wide ring) or a red ring on a stop
  const fin=run.ev[run.ev.length-1];const pe=(c-fin.t)/1900;
  if(pe>=0&&pe<=1){const rr=coreR+(R*1.12-coreR)*(1-Math.pow(1-pe,3));g.strokeStyle=`rgba(${fin.err?AGX.bad:AGX.accent},${(1-pe)*.6})`;g.lineWidth=2+7*(1-pe);g.beginPath();g.arc(cx,cy,rr,0,6.284);g.stroke()}
  // stations
  for(const st of RING){const s=S_[st],[x,y]=pos[st];const fl=Math.max(0,1-(c-s.lastEnd)/500);
    drawStation(g,x,y,st,{now,r:R<150?15:22,act:s.act>0,uses:s.uses,err:s.err,par:s.act,elapsed:s.el,flash:s.act?0:fl,count:used.has(st)?String(s.uses):'',dim:!used.has(st)})}
  // core
  const pct=tokAt(run,c)/run.cfg.cap;
  drawCore(g,cx,cy,coreR,now,{running:!done&&c>0,pct,title:run.a.code,big:coreR>46?16:coreR>38?14:11,top:Math.round(pct*100)+'% tokens',topCol:pct>=.9?'rgba(255,140,140,.95)':pct>=.7?'rgba(255,205,120,.9)':null,sub:'run #'+run.num});
}

/* ---- fleet map: every agent, the stations they share ---- */
let fleetRot=0;
function drawFleet(cv,now){
  const g=cv.getContext('2d'),W=cv._w,H=cv._h;g.setTransform(DPR,0,0,DPR,0,0);
  const cx=W/2,cy=H/2+4,rx=Math.max(160,W/2-88),ry=Math.max(120,H/2-58),nLive=Object.keys(LIVE).length;
  stageBg(g,W,H,cv,now,nLive?1:.45,cx,cy);
  const pos={};FLEET_RING.forEach((st,i)=>{const a=-Math.PI/2+i/FLEET_RING.length*6.283;pos[st]=[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]});
  const arx=rx*.5,ary=ry*.56;
  AGENTS.forEach((a,i)=>{const an=-Math.PI/2+(i+.5)/AGENTS.length*6.283+fleetRot;pos[a.id]=[cx+Math.cos(an)*arx,cy+Math.sin(an)*ary]});
  cv._pos=pos;const coreR=34;
  // faint spokes core to stations
  for(const st of FLEET_RING){const [x,y]=pos[st];g.strokeStyle=`rgba(${AGX[STN[st].h]},.06)`;g.lineWidth=1;g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke()}
  // core to agents
  for(const a of AGENTS){const [x,y]=pos[a.id];g.strokeStyle=`rgba(171,140,255,${LIVE[a.id]?.32:a.status==='paused'?.06:.14})`;g.lineWidth=LIVE[a.id]?1.5:1;g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke();
    if(LIVE[a.id]&&!RMOTION){const u=((now/1600)+a.id.length*.13)%1;impulse(g,qp([cx,cy],[x,y],0),u,AGX.agent)}}
  // live runs
  const act={};
  for(const id in LIVE){const run=LIVE[id],A=pos[id];if(!A)continue;const c=run.clock;
    for(const e of run.ev){if(e.st==='kinetic')continue;const B=pos[e.st];if(!B)continue;const rgb=e.err?AGX.bad:AGX[STN[e.st].h];
      const bend=(e.par>1?(e.pi-(e.par-1)/2)*30:0)+Math.hypot(B[0]-A[0],B[1]-A[1])*.12;const f=qp(A,B,bend);
      const on=c>=e.t&&c<e.t+Math.max(e.dur,TRAVEL);if(on){g.strokeStyle=`rgba(${rgb},.3)`;g.lineWidth=1.2;curve(g,f,0,1);g.stroke();act[e.st]=(act[e.st]||0)+1}
      const uo=(c-e.t)/TRAVEL;if(uo>=0&&uo<=1)impulse(g,e.msg?qp(B,A,-bend):f,ease(uo),e.msg?AGX.you:rgb);
      const ub=(c-e.t-e.dur)/TRAVEL;if(e.dur&&ub>=0&&ub<=1)impulse(g,qp(B,A,-bend),ease(ub),rgb)}}
  // approval and change-request impulses
  const flashes={};
  for(const f of FX){if(now<f.t0)continue;const A=pos[f.a],B=pos[f.b];if(!A||!B)continue;const u=Math.min(1,(now-f.t0)/f.dur);
    const q=qp(A,B,Math.hypot(B[0]-A[0],B[1]-A[1])*.18);g.strokeStyle=`rgba(${f.rgb},${.35*(1-u*.5)})`;g.lineWidth=1.4;curve(g,q,0,u);g.stroke();impulse(g,q,ease(u),f.rgb);if(u>.8)flashes[f.b]=Math.max(flashes[f.b]||0,(u-.8)*5)}
  for(const st of FLEET_RING){const [x,y]=pos[st];drawStation(g,x,y,st,{now,r:20,act:act[st]>0,par:act[st],uses:1,flash:flashes[st]||0})}
  drawCore(g,cx,cy,coreR,now,{running:nLive>0,title:'KINETIC',big:12,top:nLive?nLive+' running':'idle',sub:AGENTS.length+' agents'});
  // agents
  for(const a of AGENTS){const [x,y]=pos[a.id];drawAgentNode(g,x,y,a,now,S.ag.hoverId===a.id,flashes[a.id]||0)}
}
function drawAgentNode(g,x,y,a,now,hover,flash){
  const run=LIVE[a.id],paused=a.status==='paused',r=hover?17:15,rgb=paused?[140,146,170]:AGX.agent;
  if(run){const k=run.ev.find(e=>e.st==='kinetic'&&run.clock>=e.t&&run.clock<e.t+e.dur);halo(g,x,y,r*3.4,rgb,(k?.5:.32)+.15*Math.sin(now/300))}
  if(flash)halo(g,x,y,r*3,AGX.governance,.5*flash);
  if(hover)halo(g,x,y,r*2.4,rgb,.25);
  const f=g.createRadialGradient(x-r*.35,y-r*.4,0,x,y,r);f.addColorStop(0,paused?'#9a9db0':'#e6dcff');f.addColorStop(.45,`rgba(${rgb},${paused?.55:.95})`);f.addColorStop(1,paused?'#2a2c3a':'#2b1d58');
  g.globalAlpha=paused?.6:1;g.fillStyle=f;g.beginPath();g.arc(x,y,r,0,6.284);g.fill();g.globalAlpha=1;
  if(run){g.save();g.setLineDash([3,4]);g.lineDashOffset=RMOTION?0:-now/40;g.strokeStyle='rgba(171,140,255,.8)';g.lineWidth=1.2;g.beginPath();g.arc(x,y,r+5,0,6.284);g.stroke();g.restore();
    const p=Math.min(1,tokAt(run,run.clock)/run.cfg.cap);g.strokeStyle=p>=.9?`rgb(${AGX.bad})`:p>=.7?`rgb(${AGX.governance})`:`rgb(${AGX.accent})`;g.lineWidth=2;g.lineCap='round';g.beginPath();g.arc(x,y,r+9,-Math.PI/2,-Math.PI/2+p*6.283);g.stroke();g.lineCap='butt'}
  const pend=pendingFor(a.id),last=a.runs[0];
  if(pend){const bx=x+r*.85,by=y-r*.85;g.fillStyle='rgb(227,166,64)';g.beginPath();g.arc(bx,by,8,0,6.284);g.fill();g.fillStyle='#14100a';g.font='700 9px "JetBrains Mono",monospace';g.textAlign='center';g.fillText(pend,bx,by+3)}
  if(!run&&last&&(last.kind==='budget'||last.kind==='failed')){const bx=x-r*.85,by=y-r*.85;g.fillStyle='rgb(236,90,90)';g.beginPath();g.arc(bx,by,5,0,6.284);g.fill()}
  g.textAlign='center';g.font=`600 ${hover?12:11.5}px Inter,sans-serif`;g.fillStyle=paused?'rgba(196,199,215,.6)':'#fff';g.fillText(a.name,x,y+r+16);
