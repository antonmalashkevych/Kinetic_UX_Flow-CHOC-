<title>Ana Unified Chat v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: exact replica of the Kinetic/CHOC v2 shell (tokens, type, components extracted from the live staging app), with the Option 1 UX changes: Ana-first sidebar, Ask Ana docked panel on every page, full-screen chat, one conversation store. Single committed dark theme (Kinetic ships dark). */
:root{
  --k-bg:#262a40; --k-side:#191e31; --k-surface:#262a40; --k-raised:#32364f;
  --k-ink:#ffffff; --k-ink-2:#c4c7d7; --k-muted:#9c9fb2;
  --k-line:#32364f; --k-line-2:#484c63;
  --k-accent:#ee6d0b; --k-accent-ink:#ff8d40; --k-accent-soft:rgba(238,109,11,.2);
  --k-hover:rgba(255,141,64,.16); --k-hover-neutral:#484c63;
  --k-grad:linear-gradient(180deg,#EE6D0B 19%,#D35B00 100%); --k-on-grad:#050505;
  --k-ok:#7cc076; --k-warn:#e3a640; --k-bad:#ec7b7b; --k-info:#7fb0dc;
  --k-r:.5rem; --k-nav:14.75rem;
  --k-shadow-float:0 2px .5rem rgba(0,0,0,.5); --k-shadow-panel:0 0 1.25rem rgba(0,0,0,.25);
  --k-font:Inter,"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--k-line-2) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--k-line-2);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:#565b73}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-corner{background:transparent}
html{color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--k-bg);color:var(--k-ink);font-family:var(--k-font);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
::placeholder{color:var(--k-muted)}
svg.k-i{width:1rem;height:1rem;flex:0 0 auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- prototype bar ---------- */
#demobar{height:40px;display:flex;align-items:center;gap:12px;background:#0d101c;border-bottom:1px solid var(--k-line-2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none;font-size:12px;color:var(--k-muted)}
#demobar .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#demobar b{color:var(--k-ink);font-weight:600;font-size:12.5px}
#demobar .hint{margin-left:auto}
#demobar kbd{background:var(--k-raised);border:1px solid var(--k-line-2);border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--k-ink-2)}

/* ---------- frame ---------- */
#app{display:flex;height:calc(100% - 40px)}
#stage{flex:1;display:flex;min-width:0}
#page{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#panel{width:0;flex:none;background:var(--k-side);border-right:1px solid var(--k-line);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease;box-shadow:var(--k-shadow-panel)}
#panel.open{width:400px}
@media (max-width:900px){#sidebar{display:none!important}#panel.open{width:min(400px,88vw)}.canvas{position:fixed;inset:40px 0 0 0;width:auto!important;max-width:none!important;z-index:55}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}

/* ---------- sidebar (exact k-nav) ---------- */
.k-nav{width:var(--k-nav);flex:0 0 auto;height:100%;display:flex;flex-direction:column;gap:.25rem;padding:1rem .75rem 0;overflow:auto;background:var(--k-side);border-right:1px solid var(--k-line);color:var(--k-ink);font-size:.875rem}
.k-nav>*{flex-shrink:0}
.k-brand{display:flex;align-items:center;gap:.625rem;padding:2px .5rem .875rem;min-width:0}
.k-brand img{height:22px;width:auto;object-fit:contain;flex-shrink:0}
.k-brand__name{display:grid;min-width:0;font-size:.9375rem;font-weight:600;line-height:1.2}
.k-brand__client{font-size:.75rem;font-weight:500;color:var(--k-muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-iconbtn{width:1.875rem;height:1.875rem;flex:0 0 auto;display:grid;place-items:center;border-radius:.375rem;color:var(--k-muted)}
.k-iconbtn:hover{background:var(--k-hover);color:var(--k-ink)}
.k-brand__toggle{margin-left:auto}
.k-newchat{display:flex;align-items:center;gap:.625rem;margin-bottom:.5rem;padding:.625rem .75rem;cursor:pointer;border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface);color:var(--k-ink);font-weight:600;width:100%}
.k-newchat:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-navitem{display:flex;align-items:center;gap:.625rem;width:100%;cursor:pointer;border-radius:.375rem;color:var(--k-ink-2);padding:.5625rem .75rem;text-decoration:none}
.k-navitem:hover{background:var(--k-hover);color:var(--k-ink)}
.k-navitem.on{background:var(--k-accent-soft);color:var(--k-accent-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--k-accent)}
.k-navitem .kbd{margin-left:auto;font-size:.6875rem;color:var(--k-muted);font-weight:400}
.k-navsec{margin-top:1.125rem;padding:0 .75rem .375rem;font-size:.75rem;color:var(--k-muted)}
.k-navsec--link{display:flex;align-items:center;gap:.25rem;border-radius:.375rem;text-decoration:none;width:100%}
.k-navsec--link:hover{color:var(--k-ink)}
.k-navsec--link .k-i{width:.75rem;height:.75rem;opacity:0;transition:opacity .15s}
.k-navsec--link:hover .k-i{opacity:1}
.k-navempty{padding:2px .75rem;font-size:.75rem;color:var(--k-muted);margin:0}
.k-navlink{display:flex;align-items:center;gap:.5rem;width:100%;cursor:pointer;border-radius:.375rem;color:var(--k-ink-2);padding:.4375rem .75rem;font-size:.8125rem}
.k-navlink:hover{background:var(--k-hover);color:var(--k-ink)}
.k-navlink.on{color:var(--k-accent-ink)}
.k-navlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.k-navfoot{position:sticky;bottom:0;z-index:2;margin-top:auto;display:flex;align-items:center;gap:.25rem;padding:.625rem .25rem;background:var(--k-side);border-top:1px solid var(--k-line)}
.k-userbtn{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1;border-radius:.375rem;padding:.25rem}
.k-userbtn:hover{background:var(--k-hover)}
.k-avatar{width:1.75rem;height:1.75rem;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--k-raised);font-size:.6875rem;font-weight:700}
.k-who{flex:1 1 0%;min-width:0;font-size:.8125rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--k-ink)}
.k-who small{display:block;font-size:.7188rem;color:var(--k-muted);overflow:hidden;text-overflow:ellipsis}
.k-navfoot__tools{display:flex;align-items:center;gap:.125rem}

/* ---------- page header (exact) ---------- */
.k-head{position:relative;z-index:10;display:flex;height:3.5rem;flex-shrink:0;align-items:center;gap:.75rem;border-bottom:1px solid var(--k-line);background:var(--k-surface);box-shadow:0 1px 0 var(--k-line-2);padding:0 1.5rem}
.k-crumbs{font-size:13px;color:var(--k-muted);min-width:0}
.k-crumbs ol{display:flex;align-items:center;gap:.5rem;list-style:none;margin:0;padding:0}
.k-crumbs a{color:var(--k-muted);text-decoration:none;cursor:pointer}
.k-crumbs a:hover{color:var(--k-ink)}
.k-crumbs .cur{color:var(--k-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-btn{display:inline-flex;align-items:center;gap:.4375rem;height:2rem;padding:0 .875rem;border-radius:.375rem;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink);font-size:.8125rem;font-weight:600;white-space:nowrap;cursor:pointer}
.k-btn:hover{background:var(--k-hover);border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-btn--primary{background:var(--k-grad);color:var(--k-on-grad);border:0;box-shadow:rgba(0,0,0,.2) 0 0 .25rem}
.k-btn--primary:hover{background:var(--k-grad);color:var(--k-on-grad);filter:brightness(1.06)}
.k-btn--quiet{border-color:transparent;background:transparent;color:var(--k-ink-2)}
.k-btn--quiet:hover{background:var(--k-hover-neutral);color:var(--k-ink);border-color:transparent}
.k-btn kbd{font-family:ui-monospace,monospace;font-size:.6563rem;font-weight:400;color:inherit;opacity:.65}
.askana .dot{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--k-accent);box-shadow:0 0 5px var(--k-accent)}
.k-scroll{flex:1;overflow-y:auto;min-height:0}

/* ---------- page bodies (exact patterns) ---------- */
.k-wrap{margin:0 auto;width:100%;padding:1.5rem;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
.k-wrap--lib{max-width:80rem}
.k-wrap--std{max-width:71.25rem}
.k-h1-light{font-size:24px;font-weight:300;margin:0;letter-spacing:-.01em;text-wrap:balance}
.k-h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.015em;text-wrap:balance}
.k-sub{margin:.125rem 0 0;color:var(--k-muted);font-size:.875rem}
.k-pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem;margin-bottom:1.25rem}
.k-pagehead .ml{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.k-tabs{display:flex;gap:.25rem;box-shadow:inset 0 -1px 0 var(--k-line-2);margin-bottom:1rem}
.k-tab{padding:8px 12px;font-size:14px;color:var(--k-muted);display:inline-flex;align-items:center;gap:.4rem;border-bottom:2px solid transparent}
.k-tab:hover{color:var(--k-ink)}
.k-tab.on{color:var(--k-ink);font-weight:600;border-bottom-color:var(--k-accent)}
.k-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--k-hover-neutral);color:var(--k-ink);font-size:11px;font-weight:600}
.k-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.625rem;margin-bottom:1rem}
.k-chips{display:flex;flex-wrap:wrap;gap:.375rem}
.k-chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:16px;border:1px solid var(--k-line-2);background:transparent;color:var(--k-ink-2);font-size:12px;font-weight:600}
.k-chip:hover{color:var(--k-ink);border-color:var(--k-hover-neutral)}
.k-chip.on{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-on-grad)}
.k-search{display:inline-flex;align-items:center;gap:.5rem;height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-muted);min-width:12.5rem}
.k-search input{flex:1;min-width:0;color:var(--k-ink)}
.k-select{display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink-2);font-size:.8125rem}
.k-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:6px;border:1px solid var(--k-line-2);background:var(--k-side)}
.k-seg button{display:inline-flex;align-items:center;gap:.375rem;padding:4px 10px;border-radius:4px;font-size:.8125rem;color:var(--k-ink-2)}
.k-seg button.on{background:var(--k-grad);color:var(--k-on-grad);font-weight:600}
.k-card{border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface)}
.k-card__head{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-bottom:1px solid var(--k-line-2);font-size:.8125rem;font-weight:600}
.k-card__actions{margin-left:auto}
.k-empty{padding:1.75rem;text-align:center;color:var(--k-muted)}
.k-empty__title{color:var(--k-ink);font-weight:600;margin:0 0 .25rem}
.k-empty p{margin:0}
.k-librail{display:grid;min-width:0;grid-template-columns:minmax(0,1fr);content:start;align-content:start;gap:2px}
.k-librail button{display:flex;align-items:center;gap:.5rem;padding:.4375rem .625rem;border-radius:.375rem;font-size:.8125rem;color:var(--k-ink-2)}
.k-librail button.on{background:var(--k-accent-soft);color:var(--k-accent-ink);font-weight:600}
.k-librail button:not(.on):hover{background:var(--k-hover)}
.k-libgrid{display:grid;gap:1.25rem}
@media (min-width:1180px){.k-libgrid{grid-template-columns:13.75rem minmax(0,1fr)}}
.k-conv{display:flex;align-items:center;gap:.625rem;width:100%;padding:.6875rem .875rem;border:1px solid var(--k-line-2);border-radius:var(--k-r);background:var(--k-surface);margin-bottom:.5rem}
.k-conv:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-conv .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-conv time{margin-left:auto;color:var(--k-muted);font-size:.75rem;flex:none}
.k-conv .st{font-size:.6875rem;color:var(--k-ok);border:1px solid var(--k-line-2);border-radius:999px;padding:1px 8px;flex:none}

/* ---------- Cerebrum galaxy ---------- */
.cb-stage{position:relative;overflow:hidden;border-radius:.5rem;border:1px solid var(--k-line-2);background:#141829;height:30rem}
.cb-stage canvas{display:block;width:100%;height:100%;cursor:grab}
.cb-top{position:absolute;inset:0 0 auto;display:flex;flex-wrap:wrap;align-items:flex-start;gap:.5rem 1rem;padding:.75rem .875rem;pointer-events:none}
.cb-top .idw{display:flex;align-items:center;gap:.625rem;min-width:max-content;flex:1 1 0}
.cb-top .icw{display:grid;place-items:center;height:1.5rem;width:1.5rem;color:var(--k-accent-ink)}
.cb-name{margin:0;font-size:.875rem;font-weight:600}
.cb-meta{margin:1px 0 0;font-size:11px;color:var(--k-muted);font-family:ui-monospace,monospace}
.cb-group{display:flex;align-items:center;gap:.5rem;pointer-events:auto}
.cb-group .lbl{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.09em;color:var(--k-muted)}
.cb-group .btns{display:flex;align-items:center;gap:3px;border-radius:.5rem;background:rgba(25,30,49,.8);border:1px solid var(--k-line-2);padding:2px}
.cb-group .btns button{border-radius:.375rem;padding:4px 10px;font-size:11px;color:var(--k-ink-2)}
.cb-group .btns button.on{background:var(--k-raised);color:var(--k-ink)}
.cb-find{margin-left:auto;pointer-events:auto}
.cb-find input{box-sizing:border-box;width:250px;border-radius:.5rem;font-size:12px;background:rgba(25,30,49,.8);border:1px solid var(--k-line-2);padding:6px 10px;color:var(--k-ink)}
.cb-chipline{position:absolute;top:3.4rem;left:.875rem;display:flex;flex-wrap:wrap;gap:.375rem}
.cb-chipline button{pointer-events:auto;display:inline-flex;align-items:center;gap:.375rem;font-size:11px;color:var(--k-ink-2);background:rgba(25,30,49,.8);border:1px solid var(--k-line-2);border-radius:999px;padding:3px 10px}
.cb-chipline .sw{height:.375rem;width:.375rem;border-radius:2px;background:var(--k-accent)}
.cb-bottom{position:absolute;inset:auto 0 0;display:flex;align-items:flex-end;gap:1rem;padding:.75rem .875rem;pointer-events:none;font-family:ui-monospace,monospace}
.cb-bottom .left{min-width:0;flex:1}
.cb-zoom{display:flex;align-items:center;gap:.25rem;pointer-events:auto;background:rgba(25,30,49,.8);border:1px solid var(--k-line-2);border-radius:.5rem;padding:2px;width:max-content}
.cb-zoom button{border-radius:.375rem;padding:5px;line-height:0;color:var(--k-ink-2)}
.cb-zoom .pct{min-width:2.375rem;text-align:center;font-size:10.5px;color:var(--k-ink-2)}
.cb-conn{pointer-events:auto;display:inline-flex;align-items:center;gap:.375rem;border-radius:999px;background:rgba(25,30,49,.8);border:1px solid var(--k-line-2);padding:3px 10px;font-size:11px;color:var(--k-ink-2);margin-left:.5rem}
.cb-conn .sw{height:7px;width:7px;border-radius:2px;background:var(--k-ok)}
.cb-hint{margin:.4rem 0 0;font-size:11px;color:var(--k-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-right{margin-left:1.5rem;min-width:0;flex-shrink:1;text-align:right;font-size:11px;color:var(--k-muted)}
.cb-right p{margin:0 0 .125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-right .l1{font-size:12px;color:var(--k-ink-2)}

/* ---------- chat (home replica + thread) ---------- */
.chatwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.k-home{margin:0 auto;width:100%;max-width:51.25rem;padding:4.5rem 1.5rem 8.75rem}
.k-home--thread{padding:1.75rem 1.5rem 1rem}
#panel .k-home{padding:1rem 1rem 1.5rem;max-width:none}
.k-home__id{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.k-home__id img{height:34px;width:auto;object-fit:contain}
#panel .k-home__id img{height:24px}
.k-home__id small{display:block;font-size:.75rem;color:var(--k-muted);line-height:1.2}
.k-home__id b{font-size:.9375rem;line-height:1.2}
.k-home__title{font-size:28px;font-weight:300;margin:0 0 .375rem;text-wrap:balance}
.k-home__sub{margin:0 0 1.5rem;color:var(--k-muted);font-size:.875rem;max-width:46rem}
.k-composer{border:1px solid var(--k-line-2);border-radius:.5rem;background:var(--k-surface);padding:12px 12px 10px;box-shadow:var(--k-shadow-float)}
.k-composer:focus-within{border-color:var(--k-accent)}
.k-ctx{display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.5rem}
.k-ctx:empty{display:none}
.k-ctx{flex-wrap:wrap}.k-ctx.one{flex-wrap:nowrap;overflow:hidden}.k-ctxchip .ct{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.k-ctxmore{height:24px;padding:0 9px;border-radius:999px;border:1px dashed var(--k-line-2);color:var(--k-ink-2);font-size:11.5px;white-space:nowrap;flex:none}.k-ctxmore:hover{border-color:var(--k-accent);color:var(--k-ink)}
.k-ctxchip{display:inline-flex;align-items:center;gap:.375rem;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--k-line-2);background:var(--k-raised);color:var(--k-ink-2);font-size:11.5px}
.k-ctxchip .k-i{width:.75rem;height:.75rem;color:var(--k-accent-ink)}
.k-ctxchip button{display:grid;place-items:center;color:var(--k-muted);line-height:0}
.k-ctxchip button:hover{color:var(--k-ink)}
.k-ctxchip button .k-i{width:.7rem;height:.7rem;color:inherit}
.k-composer textarea{width:100%;resize:none;min-height:3rem;max-height:15rem;line-height:1.5;display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--k-line-2) transparent}
.k-composer textarea::-webkit-scrollbar{width:6px}
.k-composer textarea::-webkit-scrollbar-thumb{background:var(--k-line-2);border-radius:3px}
.k-composer textarea::-webkit-scrollbar-track{background:transparent}
#panel .k-composer textarea{min-height:3.4rem}
.k-comprow{display:flex;align-items:center;gap:.5rem;margin-top:.375rem}
.k-micbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--k-line-2);background:var(--k-surface);color:var(--k-ink-2);display:grid;place-items:center}
.k-micbtn:hover{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-modewrap{position:relative;margin-left:auto}
.k-modebtn{display:inline-flex;align-items:center;gap:.35rem;height:32px;padding:0 12px;border-radius:6px;background:var(--k-raised);color:var(--k-ink);font-size:.875rem;font-weight:600}
.k-modebtn:hover{filter:brightness(1.1)}
.k-modepop{position:absolute;bottom:calc(100% + 12px);right:0;min-width:13rem;background:#2b3047;border:1px solid var(--k-line-2);border-radius:.625rem;padding:.625rem;box-shadow:var(--k-shadow-float);z-index:40}
.k-modepop h5{margin:0 0 .5rem;padding:0 .25rem;font-size:.8125rem;font-weight:400;color:var(--k-muted)}
.k-modeopt{display:flex;align-items:center;gap:.75rem;width:100%;padding:.5rem .75rem;border-radius:.5rem;border:1.5px solid transparent;color:var(--k-ink);font-size:.9375rem}
.k-modeopt:hover{background:var(--k-hover)}
.k-modeopt.on{border-color:var(--k-accent);color:var(--k-accent-ink)}
.k-modeopt .mi{width:1rem;text-align:center;font-weight:600;font-size:.875rem}
.k-modeopt .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--k-accent)}
.k-modepop .foot{margin:.5rem 0 0;padding:0 .25rem;font-size:.8125rem;color:var(--k-muted)}
.k-modepop--down{bottom:auto;top:calc(100% + 12px)}

  html:`<p>Accounts AR 90+ for 2026-10 is <b>$103,746,373.86</b>. Against Accounts Total Current Balance of <b>$663,353,084.96</b> for the same period, it represents <b>15.64%</b> of total A/R.</p>
<p>Both figures were read from the current snapshot available to the product; the contract's calendar label is 2026-10, but the snapshot actually read is whatever the product last loaded, not confirmed to be the calendar close.</p>
<p>The underlying measure is positive-valued: it grows as the overdue balance rises.</p>
<p>Three filters were applied that the question did not ask for: the current snapshot only, real patients only (excluding test/synthetic accounts), and non-zero account balances.</p>
<h3 class="ansh">Derivation</h3>
<p>The 15.64% figure is a derived share, not a governed metric in its own right: it is computed as (Accounts AR 90+ ÷ Accounts Total Current Balance) × 100, using the two governed measures above. It carries no metric standard, no definition authority and no owner of its own, so it should not be read or cited as if it were a named governed metric - it is reported here by its operands. There is only one group in this computation (the whole population), so this share is also, trivially, the overall ratio: the shares of all groups add up to the whole's own ratio, and there is no breakdown here to sum incorrectly.</p>

const RUNSTEPS=['Understanding request','Matching analysis archetype','Resolving terms','Discovering data','Running queries','Composing findings','Working on next steps'];
function runHTML(m){
  const idx=S.thread.indexOf(m),a=m.a||{};
  const elapsed=((m.end||Date.now())-m.start)/1000;
  const t=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
  const task=a.task||m.arch;
  const header=m.failed==='error'?`<span class="ttl"><b>Kinetic</b> could not finish</span>`
    :m.failed==='partial'?`<span class="ttl"><b>Kinetic</b> returned a partial result</span>`
    :m.failed==='refuse'?`<span class="ttl"><b>Kinetic</b> could not answer this</span>`
    :m.waiting?`<span class="ttl"><b>Kinetic</b> needs one thing from you</span>`
    :m.stopped?`<span class="ttl"><b>Kinetic</b> stopped at step ${m.cur+1} of 7</span>`
    :m.done?`<span class="ttl"><b>Kinetic</b> worked on ${esc(task)}</span>`
    :m.cur===0?`<span class="ttl"><b>Kinetic</b> is starting</span>`
    :`<span class="ttl"><b>Kinetic</b> is ${esc(task)}</span>`;
  const mark=m.failed==='refuse'||m.waiting?'w':m.failed?'f':'';
  const bar=`<div class="runbar">${RUNSTEPS.map((_,j)=>`<i class="${(m.failed||m.waiting)?(j<m.cur?'d':j===m.cur?mark||'w':''):(m.done&&!m.stopped)||j<m.cur?'d':(!m.done&&j===m.cur)?'c':''}"></i>`).join('')}</div>`;
  const toggle=`<button class="runtoggle" data-runtoggle="${idx}">${m.expanded?'Hide':'Show'} details ${ic(m.expanded?'chevron-up':'chevron-down')}</button>`;
  const cn=a.counts||{m:0,f:0,p:0};
  const counts=`${cn.m} ${cn.m===1?'metric':'metrics'} · ${cn.f} ${cn.f===1?'finding':'findings'}${cn.p?` · ${cn.p} playbook`:''}`;
  const line=m.waiting?`<div class="runline"><span class="amber">Waiting on you · Step ${m.cur+1} of 7, <b>${RUNSTEPS[m.cur]}</b></span>${toggle}</div>`
    :m.done
    ?`<div class="runline"><span>${m.failed?'Stopped at step '+(m.cur+1)+' of 7':m.stopped?'Stopped':'Done · '+esc(m.arch)+' · '+counts} · ${elapsed.toFixed(1)} s</span>${toggle}</div>`
    :`<div class="runline"><span class="spin"></span><span>Step ${m.cur+1} of 7, <b>${RUNSTEPS[m.cur]}</b></span>${toggle}</div>`;
  const tick=Math.floor((Date.now()-m.start)/700);
  const steps=m.expanded?`<div class="runsteps">${RUNSTEPS.map((nm,j)=>{
    const done=m.failed?j<m.cur:(m.done&&!m.stopped)||j<m.cur;
    const cur=!m.done&&j===m.cur;
    const tl=(arr)=>arr.map(x=>`<span class="tl">${esc(x)}</span>`).join('');
    let sub='';
    if(j===0)sub=cur?'Thinking through your request':done?'“'+esc(m.q)+'”':'';
    if(j===1){
      if(cur)sub='Comparing against 6 archetypes';
      if(done)sub=`<span style="color:var(--k-ink);font-weight:600">${esc(m.arch)}</span><span class="sub">${esc(m.metrics)} · ${m.period}</span>`+((a.rejected&&a.rejected.length)?`<span class="rejlbl">Considered and rejected</span><span class="rejchips">${a.rejected.map(r=>`<span class="rejchip">${esc(r.n)} <b>${r.c}</b></span>`).join('')}</span>`:'');
    }
    if(j===2){
      if(cur&&m.waiting)sub='Waiting for your answer';
      else if(cur&&a.terms)sub='Resolving “'+esc(a.terms[tick%a.terms.length].split(' → ')[0])+'”';
      else if(done&&a.terms)sub=`${a.terms.length} terms resolved`+tl(a.terms);
    }
    if(j===3){if(cur)sub='Checking governed surfaces';else if(done&&a.data)sub=esc(a.data)}
    if(j===4){if(cur)sub=`${Math.min(a.queries||1,1+Math.floor((Date.now()-m.start)/1500)%(a.queries||1))} of ${a.queries||1} queries run`;else if(done&&a.queries)sub=`${a.queries} queries · ${esc(a.rows)}`}
    if(j===5){if(cur)sub='Writing the finding and operands';else if(done&&a.counts)sub=`${a.counts.f} findings composed`}
    if(j===6){if(cur)sub='Choosing follow-ups';else if(done&&a.fups)sub=`${a.fups.length} follow-ups, 1 action`}
    return `<div class="runstep${cur?' cur':''}${done?' done':''}">
      <span class="si">${done?`<span class="ok">${ic('check')}</span>`:cur&&m.waiting?`<span class="qm">${ic('circle-help')}</span>`:cur?`<span class="spin"></span>`:`<span class="pend"></span>`}</span>
      <span style="min-width:0;flex:1"><span class="nm">${nm}</span>${sub?`<span class="sub">${sub}</span>`:''}</span>
      ${done&&m.durs[j]?`<span class="dur">${m.durs[j]} s</span>`:''}
    </div>`}).join('')}</div>`:'';
  const need=m.waiting?`<div class="need" role="alert"><p>${esc(m.need.q)}</p><div class="cands">${m.need.cands.map((c,k)=>`<button class="k-btn" data-pick="${idx}|${k}">${esc(c)}</button>`).join('')}<button class="k-btn k-btn--quiet" data-pickother="${idx}">Something else</button></div><p class="nh">Pick one, or type your own definition below. Kinetic will not guess.</p></div>`:'';
  const skel=(m.done||m.waiting)?'':`
    <div class="skh">Understood</div><div class="sk" style="width:62%"></div><div class="sk" style="width:84%"></div><div class="sk" style="width:71%"></div>
    <div class="skh">Evidence</div><div class="skboxes"><i></i><i></i><i></i></div><div class="sk"></div><div class="sk" style="width:78%"></div>
    <div class="skh">Finding</div><div class="sk" style="width:80%"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:58%"></div>`;
  return `<div class="runcard"><div class="runhead"><span class="kmark${(m.done||m.waiting)?'':' loading'}">K</span>${header}<span class="time">${t}</span></div>${bar}${line}${steps}${need}${skel}</div>`;
}

  if(m.role==='run')return runHTML(m);
  if(m.role==='fail'){const i=S.thread.indexOf(m)-1;
    const acts=`<div class="fa"><button class="k-btn k-btn--primary" data-retry="${i}">${ic('refresh-cw')}Retry</button><button class="k-btn" data-editreq="${i}">Edit request</button></div>`;
    if(m.kind==='refuse')return `<div class="failcard warn" role="alert"><span class="fi">${ic('circle-help')}</span><div><h4>Kinetic cannot answer this from governed data</h4><p>A forecast needs a published forecasting method, and Cerebrum has none for cash. Kinetic will not build one on its own and present it as governed. Nothing was estimated.</p><div class="alt"><button class="fup" data-fup="Trend net cash by month, last 12 months">${ic('corner-down-right')}Trend net cash by month, last 12 months</button><button class="fup" data-fup="Show cash vs goal, month to date">${ic('corner-down-right')}Show cash vs goal, month to date</button></div><div class="fa"><button class="k-btn" data-reqcov="${S.thread.indexOf(m)}">${m.requested?'Coverage requested':'Request coverage'}</button></div></div></div>`;
    if(m.kind==='partial')return `<div class="failcard warn" role="alert"><span class="fi">${ic('triangle-alert')}</span><div><h4>Partial result: 2 of 3 queries returned</h4><p>The warehouse took longer than the 30 s limit on the last query. What came back is below. Nothing here is estimated, and the total is not shown because one payer is missing.</p><ul class="pl"><li>Payer A - $1.48M</li><li>Payer B - $0.94M</li><li class="miss">Payer C - not returned</li></ul>${acts}</div></div>`;
    return `<div class="failcard" role="alert"><span class="fi">${ic('triangle-alert')}</span><div><h4>Kinetic could not reach the data mart</h4><p>The request stopped at step 5 of 7, Running queries. Your question was not changed and nothing was saved or published. This is usually temporary.</p>${acts}</div></div>`}
  if(m.role==='learn'){const i=S.thread.indexOf(m);
    const body=m.forgot?`<p>Forgotten. Kinetic will ask again next time.</p>`
      :m.proposed?`<p><b>${esc(m.term)}</b> = ${esc(m.def)}.</p><p class="ok">${ic('check')} Proposed for your organization. A Cerebrum steward reviews it before it is published. Until then it applies to this conversation only.</p>`
      :`<p><b>${esc(m.term)}</b> = ${esc(m.def)}. Used for this conversation only. Nobody else sees it until a steward publishes it.</p><div class="fa"><button class="k-btn" data-propose="${i}">Propose for organization</button><button class="k-btn k-btn--quiet" data-forget="${i}">Forget this term</button></div>`;
    return `<div class="learncard"><span class="fi">${ic('book-open')}</span><div><h4>You taught Kinetic a term</h4>${body}</div></div>`}
  const a=m.answer,mi=S.thread.indexOf(m);
  const lhtml=a.html.replace(/<b>([^<]*\d[^<]*)<\/b>/g,(x,t)=>`<button class="fig" data-fig="${esc(t)}" data-mi="${mi}" title="Show where this number came from">${t}</button>`).replace(/<span class="cite">(\d)<\/span>/g,(x,n)=>{const sc=(a.sources||[]).find(q=>String(q.n)===n);return `<span class="cite" title="${esc(sc?sc.t:'')}">${n}</span>`});
  return `<div class="msg-a">
    <div class="ahead"><img src="${LOGO}" alt=""><b>Kinetic</b></div>
    <div class="anscard">
      <div class="ansbody"><div class="prose">${lhtml}</div>
        <div class="srcrow"><span class="lbl">Sources</span>${(a.sources||[]).map(q=>`<button class="srcchip" data-act="Opening ${esc(q.t)} is mocked in this prototype"><i>${q.n}</i>${esc(q.t)}</button>`).join('')}</div>
        <button class="ansrow" data-act="Grounding layers are mocked in this prototype">${ic('chevron-right')}<span>Grounding</span><span class="right">5 layers</span></button>
        <button class="ansrow" data-act="Provenance is mocked in this prototype">${ic('chevron-right')}<span>Provenance · Output contract</span></button>
      </div>
      <div class="ansfoot">
        <button class="k-btn" data-canvas="report">${ic('file-text')}Open as report</button>
        <button class="k-btn" data-canvas="dashboard">${ic('layout-grid')}Create dashboard</button>
        <button class="k-btn" data-act="Added to the Analytical library">${ic('library')}Add to library</button>
        <button class="k-btn" data-act="Subscribe is mocked in this prototype">${ic('bell')}Subscribe</button>
        <button class="k-btn" data-act="Pinned">${ic('pin')}Pin</button>
        <span style="flex-basis:100%;height:0"></span>
        <button class="k-btn k-btn--quiet" data-act="Run log is mocked in this prototype">${ic('flag')}Run log</button>
        <button class="k-btn k-btn--quiet" data-act="How I got here is mocked in this prototype">How I got here ${ic('chevron-down')}</button>
      </div>
    </div>
    <div class="msgacts" role="toolbar" aria-label="Message actions"><button class="macb" data-macts="copy" data-mi="${mi}" title="Copy" aria-label="Copy">${ic('copy')}</button><button class="macb" data-macts="regen" data-mi="${mi}" title="Regenerate" aria-label="Regenerate">${ic('refresh-cw')}</button><button class="macb${m.fb==='up'?' on':''}" data-macts="up" data-mi="${mi}" title="Helpful" aria-label="Helpful" aria-pressed="${m.fb==='up'}">${ic('thumbs-up')}</button><button class="macb${m.fb==='down'?' on':''}" data-macts="down" data-mi="${mi}" title="Not helpful" aria-label="Not helpful" aria-pressed="${m.fb==='down'}">${ic('thumbs-down')}</button><button class="macb" data-macts="share" data-mi="${mi}" title="Share" aria-label="Share">${ic('share-2')}</button></div>

  </div>`;
}

function lineageFor(fig,a){
  const f=fig.trim(),T=a.ttl||'';
  const gov=(o)=>Object.assign({gov:true,prov:'Published to Cerebrum 2026-08-14 · governed · steward: Revenue Integrity team'},o);
  if(T.startsWith('A/R')){
    const surf='ar_aging.current_snapshot',per='2026-10 · snapshot actually read is the product\'s last load, not confirmed as calendar close';
    if(/15\.64/.test(f))return {derived:true,formula:'Accounts AR 90+ ÷ Accounts Total Current Balance × 100',operands:['Accounts AR 90+ = $103,746,373.86','Accounts Total Current Balance = $663,353,084.96'],metric:'Share of total A/R (derived)',id:'no governed id',variant:'Not a governed metric. Reported by its operands.',surface:surf,primary:true,period:per,stats:'2 queries · 2 rows · 0.7 s',prov:'Derived at answer time from two governed measures. No owner of its own.',gov:false};
    if(/663/.test(f))return gov({metric:'Accounts Total Current Balance',id:'accounts_total_current_balance_v1',variant:'Base definition. No client variant.',surface:surf,primary:true,period:per,stats:'2 queries · 2 rows · 0.7 s'});
    return gov({metric:'Accounts AR 90+',id:'accounts_ar_90_plus_v1',variant:'Base definition. No client variant.',surface:surf,primary:true,period:per,stats:'2 queries · 2 rows · 0.7 s'});
  }
  if(T.startsWith('Denial rate')){
    const surf='denials_mart.account_balance',per='2026-09 · date basis: posted date';
    const stats='2 queries · 2 rows · 0.6 s';
    const taught=(S.taught&&S.taught['high-risk accounts'])||'balance over $5,000';
    if(/points/.test(f))return {derived:true,formula:'Denial rate (high-risk) − Denial rate (all other accounts)',operands:['11.8% (high-risk accounts)','7.2% (all other accounts)'],metric:'Gap in denial rate (derived)',id:'no governed id',variant:'Not a governed metric. Reported by its operands.',surface:surf,primary:true,period:per,stats,prov:'Derived at answer time.',gov:false};
    return {gov:false,metric:'Denial Rate',id:'denial_rate_v1',variant:'Base definition of Denial Rate. Population filter: high-risk accounts = '+taught+'.',surface:surf,primary:true,period:per,stats,prov:'Metric is governed. The population definition was taught in this conversation and is not published.',partial:true};
  }
  const surf='denials_mart.month_close',per='2026-09 · date basis: posted date',stats='3 queries · 1,204 rows · 0.9 s';
  if(/6\.4/.test(f))return {derived:true,formula:'Denied Amount 2026-09 ÷ Denied Amount 2026-08 − 1',operands:['Denied Amount 2026-09 = $4.21M','Denied Amount 2026-08 = $3.96M'],metric:'Change vs prior month (derived)',id:'no governed id',variant:'Not a governed metric. Reported by its operands.',surface:surf,primary:true,period:per,stats,prov:'Derived at answer time from one governed measure across two periods.',gov:false};
  const pm=f.match(/Payer ([A-C])/);
  return gov({metric:'Denied Amount'+(pm?' · Payer '+pm[1]:''),id:'denied_amount_v1',variant:'CHOC variant of base Denied Amount (VARIANT_OF base v1). Adds: excludes contractual write-offs.',surface:surf,primary:true,period:per,stats});
}

/* ============ galaxy canvas ============ */
function drawGalaxy(){
  const cv=document.getElementById('galaxy');if(!cv)return;
  const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;
  const x=cv.getContext('2d');x.scale(2,2);
  const groups=[{cx:.3,cy:.45,n:700,col:'255,141,64'},{cx:.62,cy:.35,n:520,col:'127,176,220'},{cx:.52,cy:.68,n:430,col:'124,192,118'},{cx:.78,cy:.62,n:300,col:'196,199,215'}];
  let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(const g of groups){
    for(let i=0;i<g.n;i++){
      const a=rnd()*Math.PI*2, d=Math.pow(rnd(),.5)*Math.min(r.width,r.height)*.16;
      const px=g.cx*r.width+Math.cos(a)*d*1.35, py=g.cy*r.height+Math.sin(a)*d;
      x.fillStyle=`rgba(${g.col},${(.18+rnd()*.6).toFixed(2)})`;
      const s=rnd()<.06?1.8:.9;
      x.fillRect(px,py,s,s);
    }
    x.fillStyle='rgba(255,255,255,.75)';x.font='10px ui-monospace,monospace';
  }
  const labels=[['Grounding',.3,.45],['Execution',.62,.35],['Agentic',.52,.68],['Governance',.78,.62]];
  x.font='10.5px ui-monospace,monospace';
  for(const [t,gx,gy] of labels){x.fillStyle='rgba(255,255,255,.55)';x.fillText(t,gx*r.width-x.measureText(t).width/2,gy*r.height)}
}

  if(S.page==='cerebrum')requestAnimationFrame(drawGalaxy);
  if(S.renaming){const ri=document.getElementById('renameInput');if(ri&&document.activeElement!==ri){ri.focus();ri.select()}}
  S.justPromoted=false;
}

/* ============ chat engine ============ */
function send(text,opts){
  opts=opts||{};
  text=(text||'').trim();
  if(!text||S.streaming)return;
  const w=S.thread.find(x=>x.role==='run'&&x.waiting);
  if(w){resolveNeed(w,text);return}
  if(opts.retry){while(S.thread.length&&S.thread[S.thread.length-1].role!=='user')S.thread.pop()}
  else{
    if(!S.thread.length)S.threadTitle=text.length>46?text.slice(0,44)+'…':text;
    S.thread.push({role:'user',text});
  }
  /* prototype devices: "error" / "timeout" / "forecast" / "high risk" in a request demonstrate failure, partial, refusal and needs-you states. Retry and Regenerate skip them. */
  const kind=opts.retry?null:/\berror\b|\bfail/i.test(text)?'error':/timeout|time out/i.test(text)?'partial':/forecast|predict|projection|next quarter/i.test(text)?'refuse':null;
  const needs=!opts.retry&&!kind&&/high.?risk/i.test(text)&&!(S.taught&&S.taught['high-risk accounts']);
  const ans=pickAnswer(text);
  const run={role:'run',cur:0,done:false,stopped:false,expanded:false,start:Date.now(),durs:[],q:text,arch:ans.arch,metrics:ans.metrics,period:ans.period,fail:kind,a:needs?riskAnswer(null):kind?Object.assign({},ans,{task:'working on your request'}):ans,need:needs?Object.assign({},RISKNEED):null};
  S.thread.push(run);
  S.streaming=true;
  render();
  runLoop(run,ans,0);
}
function runLoop(run,ans,j){
  const durms=[1300,600,500,700,1100,800,600];
  let stepStart=Date.now();
  run.cur=j;
  const flagWaiting=()=>{if(!S.panelOpen&&S.page!=='home')S.resultWaiting=true};
  run.timer=setInterval(()=>{
    if(run.stopped){clearInterval(run.timer);return}
    const el=Date.now()-stepStart;
    if(run.fail==='refuse'&&j===1&&el>=240){
      clearInterval(run.timer);run.done=true;run.failed='refuse';run.cur=1;run.end=Date.now();
      S.thread.push({role:'fail',kind:'refuse',q:run.q});S.streaming=false;flagWaiting();render();focusComposer();return;
    }
    if(run.need&&!run.need.done&&j===2&&el>=240){
      clearInterval(run.timer);run.waiting=true;run.cur=2;S.streaming=false;flagWaiting();render();focusComposer();return;
    }
    if(run.fail&&run.fail!=='refuse'&&j===4&&el>=900){
      clearInterval(run.timer);run.done=true;run.failed=run.fail;run.cur=4;run.end=Date.now();
      S.thread.push({role:'fail',kind:run.fail,q:run.q});S.streaming=false;flagWaiting();render();focusComposer();return;
    }
    if(el>=durms[j]){
      run.durs[j]=(el/1000).toFixed(1);
      j++;stepStart=Date.now();
      if(j>=durms.length){
        clearInterval(run.timer);
        run.done=true;run.cur=6;run.end=Date.now();
        S.thread.push({role:'ana',answer:ans,secs:((run.end-run.start)/1000).toFixed(1)});
        if(run.need&&run.need.done)S.thread.push({role:'learn',term:run.need.term,def:run.need.choice});
        S.streaming=false;flagWaiting();
        render();focusComposer();
        return;
      }
      run.cur=j;
    }
    render();
  },250);
}
function resolveNeed(run,choice){
  S.taught=S.taught||{};S.taught[run.need.term]=choice;
  run.need.done=true;run.need.choice=choice;run.waiting=false;
  const ans=riskAnswer(choice);run.a=ans;run.arch=ans.arch;run.metrics=ans.metrics;
  S.streaming=true;render();
  runLoop(run,ans,2);
}
function openCanvas(c){S.canvas=c;const wasPanel=S.panelOpen;if(S.panelOpen){S.returnPage=S.page;S.panelOpen=false}S.page='home';S.justPromoted=true;render();if(wasPanel&&!S.promoteToasted){toast('Opened in full view - your conversation is on the left');S.promoteToasted=true}}
function newChat(){
  if(S.thread.length)S.lastThread={title:S.threadTitle,thread:S.thread};
  S.thread=[];S.taught=null;S.threadTitle='New conversation';S.canvas=null;S.renaming=false;S.chips=S.panelOpen&&pageCtx()?[pageCtx()]:[];
}
function openMock(i){
  const m=MOCKS[i];if(!m)return;
  if(S.thread.length&&S.threadTitle!==m.title)S.lastThread={title:S.threadTitle,thread:S.thread};
  S.threadTitle=m.title;
  S.thread=[{role:'user',text:m.title},{role:'ana',answer:CANNED[m.canned],secs:'9.2'}];
  S.canvas=null;
}
function openLast(){
  if(!S.lastThread)return;
  if(S.thread.length&&S.thread!==S.lastThread.thread)S.lastThread={title:S.threadTitle,thread:S.thread};
  S.threadTitle=S.lastThread.title;S.thread=S.lastThread.thread;
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  if(S.attachOpen&&!e.target.closest('.k-attachwrap')){S.attachOpen=false;render()}
  if(S.modeOpen&&!e.target.closest('.k-modewrap')){S.modeOpen=false;render()}
  const b=e.target.closest('button, a[data-nav], a.k-navsec--link');if(!b)return;
  if(b.dataset.modebtn){S.attachOpen=false;S.modeOpen=!S.modeOpen;S.modeWhere=b.dataset.modebtn;render();return}
  if(b.dataset.mode){S.mode=b.dataset.mode;S.modeOpen=false;render();return}
  if(b.dataset.nav){S.page=b.dataset.nav;S.returnPage=null;render();return}
  if(b.dataset.navNew){newChat();S.page='home';S.panelOpen=false;S.returnPage=null;render();return}
  if(b.id==='askanaBtn'){S.panelOpen=!S.panelOpen;render();return}
  if(b.id==='pClose'){S.panelOpen=false;render();return}
  if(b.id==='pNew'){newChat();render();return}
  if(b.id==='pExpand'){S.returnPage=S.page;S.panelOpen=false;S.page='home';S.justPromoted=true;render();if(!S.promoteToasted){toast('Opened in full view - your conversation is on the left');S.promoteToasted=true}return}
  if(b.id==='dockBtn'){S.page=S.returnPage||'library';S.returnPage=null;S.panelOpen=true;render();return}
  if(b.dataset.canvas){const last=[...S.thread].reverse().find(x=>x.role==='ana');const uq=[...S.thread].reverse().find(x=>x.role==='user');openCanvas({type:b.dataset.canvas,q:uq?uq.text:S.threadTitle,answer:last?last.answer:CANNED.generic});return}
  if(b.dataset.fig!=null){const m=S.thread[+b.dataset.mi];if(!m)return;const uq=[...S.thread].reverse().find(x=>x.role==='user');openCanvas({type:'lineage',fig:b.dataset.fig,q:uq?uq.text:S.threadTitle,answer:m.answer});return}
  if(b.dataset.pick){const [ri,k]=b.dataset.pick.split('|');const r=S.thread[+ri];if(r&&r.waiting)resolveNeed(r,r.need.cands[+k]);return}
  if(b.dataset.pickother!=null){const tas=document.querySelectorAll((S.panelOpen?'#panel':'#page')+' .cinput');const ta=tas[tas.length-1];if(ta){ta.placeholder='Type your definition of high-risk accounts, then press Enter';ta.focus()}return}
  if(b.dataset.propose!=null){const m=S.thread[+b.dataset.propose];if(m){m.proposed=true;render()}return}
  if(b.dataset.forget!=null){const m=S.thread[+b.dataset.forget];if(m){m.forgot=true;if(S.taught)delete S.taught[m.term];render()}return}
  if(b.dataset.reqcov!=null){const m=S.thread[+b.dataset.reqcov];if(m){m.requested=true;render();toast('Coverage request sent to the Cerebrum steward')}return}
  if(b.dataset.macts){const m=S.thread[+b.dataset.mi];if(!m)return;const k=b.dataset.macts;
    if(k==='copy'){const d=document.createElement('div');d.innerHTML=m.answer.html;try{navigator.clipboard.writeText(d.textContent)}catch(_){}toast('Copied to clipboard')}
    else if(k==='regen'){const uq=[...S.thread.slice(0,S.thread.indexOf(m))].reverse().find(x=>x.role==='user');if(uq&&!S.streaming){S.thread.length=S.thread.indexOf(uq)+1;send(uq.text,{retry:true})}}
    else if(k==='up'||k==='down'){m.fb=m.fb===k?null:k;render();if(m.fb==='down')toast('Thanks. Tell us what was wrong in the next message, or ignore this.')}
    else if(k==='share'){toast('Link copied')}
    return}
  if(b.id==='cvClose'){S.canvas=null;render();return}
  if(b.dataset.pin){const t=b.dataset.pin;const i=S.pinned.indexOf(t);if(i>=0)S.pinned.splice(i,1);else S.pinned.push(t);render();return}
  if(b.dataset.rename!=null){S.renaming=true;render();return}
  if(b.dataset.open){const v=b.dataset.open;S.renaming=false;if(v==='last')openLast();else if(v.indexOf('mock:')===0)openMock(+v.slice(5));if(!S.panelOpen)S.page='home';render();return}
  if(b.dataset.runtoggle!=null){const m=S.thread[+b.dataset.runtoggle];if(m){m.expanded=!m.expanded;render()}return}
  if(b.dataset.runstop!=null){const m=S.thread[+b.dataset.runstop];if(m){m.stopped=true;m.done=true;m.end=Date.now();clearInterval(m.timer);S.streaming=false;render();focusComposer()}return}
  if(b.dataset.fup){send(b.dataset.fup);return}
  if(b.dataset.attachbtn){S.attachWhere=b.dataset.attachbtn;S.attachOpen=!S.attachOpen;S.modeOpen=false;render();return}
  if(b.dataset.attach){const M={file:{t:'Payer_bulletin_Oct-2026.pdf',k:'file'},report:{t:'Denied dollars, by payer · Report',k:'report'},filter:{t:'Filter: Payer A, Sep 2026',k:'filter'}};S.chips.push(M[b.dataset.attach]);S.attachOpen=false;render();return}
  if(b.dataset.chipsmore!=null){S.chipsOpen=b.dataset.chipsmore==='1';render();return}
  if(b.dataset.retry!=null){const m=S.thread[+b.dataset.retry];if(m)send(m.q,{retry:true});return}
  if(b.dataset.editreq!=null){const m=S.thread[+b.dataset.editreq];render();const tas=document.querySelectorAll((S.panelOpen?'#panel':'#page')+' .cinput');const ta=tas[tas.length-1];if(ta&&m){ta.value=m.q;ta.focus()}return}
  if(b.dataset.chip!=null){S.chips.splice(+b.dataset.chip,1);render();return}
  if(b.dataset.libchip){S.libChip=b.dataset.libchip;render();return}
  if(b.dataset.libseg){S.libSeg=b.dataset.libseg;render();return}
  if(b.dataset.ceretab){S.cereTab=b.dataset.ceretab;if(b.dataset.ceretab!=='Kinetic graph')toast('Only the Kinetic graph tab is built in this prototype');S.cereTab='Kinetic graph';render();return}
  if(b.dataset.ceregroup){S.cereGroup=b.dataset.ceregroup;render();return}
  if(b.dataset.agtab){S.agentsTab='My agents';toast('Only My agents is built in this prototype');render();return}
  if(b.dataset.convchip){S.convChip=b.dataset.convchip;render();return}
  if(b.dataset.act){toast(b.dataset.act);return}
  if(b.classList.contains('cstop')){const m=[...S.thread].reverse().find(x=>x.role==='run'&&!x.done);if(m){m.stopped=true;m.done=true;m.end=Date.now();clearInterval(m.timer);S.streaming=false;render();focusComposer()}return}
  if(b.classList.contains('csend')){const ta=b.closest('.k-composer').querySelector('.cinput');send(ta.value);return}
});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='renameInput'){
    if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v)S.threadTitle=v;S.renaming=false;render()}
    else if(e.key==='Escape'){S.renaming=false;render()}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();S.panelOpen=!S.panelOpen;render()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.page='search';render()}
  if(e.key==='Escape'){if(S.attachOpen){S.attachOpen=false;render()}else if(S.modeOpen){S.modeOpen=false;render()}else if(S.panelOpen){S.panelOpen=false;render()}}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.classList&&e.target.classList.contains('cinput')){e.preventDefault();send(e.target.value)}
});
document.addEventListener('focusout',e=>{if(e.target&&e.target.id==='renameInput'&&S.renaming){const v=e.target.value.trim();if(v)S.threadTitle=v;S.renaming=false;render()}});
window.addEventListener('resize',()=>{if(S.page==='cerebrum')drawGalaxy()});
(function(){
  const h=document.getElementById('panelResize');let sx=0,sw=0,drag=false;
  h.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sw=S.panelW;h.classList.add('drag');el('panel').classList.add('noanim');e.preventDefault();
    const mv=ev=>{if(!drag)return;S.panelW=Math.min(560,Math.max(360,sw+(ev.clientX-sx)));el('panel').style.width=S.panelW+'px'};
    const up=()=>{drag=false;h.classList.remove('drag');el('panel').classList.remove('noanim');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
})();
document.addEventListener('mousedown',e=>{const h=e.target.closest&&e.target.closest('#cvResize');if(!h)return;const cv=h.nextElementSibling;let sx=e.clientX,sw=cv.offsetWidth;h.classList.add('drag');document.body.style.userSelect='none';e.preventDefault();
  const mv=ev=>{S.canvasW=Math.min(Math.round(innerWidth*0.75),Math.max(320,sw-(ev.clientX-sx)));cv.style.width=S.canvasW+'px'};
  const up=()=>{h.classList.remove('drag');document.body.style.userSelect='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
render();
</script>
